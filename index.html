<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#f2f5fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<script>
  try { var t = localStorage.getItem('ledger.theme'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}
</script>
<style>
/* ───────────────────────── tokens ───────────────────────── */
:root {
  color-scheme: light;
  --font-ui: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Bricolage Grotesque', 'Manrope', system-ui, sans-serif;

  --page: #f2f5fa;
  --surface: #ffffff;
  --surface-2: #f6f8fc;
  --surface-3: #ebeff6;
  --line: #e3e8f1;
  --line-2: #cfd6e4;
  --ink: #141a2e;
  --ink-2: #4a5272;
  --muted: #6b7392;

  --accent: #0284c7;
  --accent-ink: #0369a1;
  --accent-soft: #e1f2fc;
  --on-accent: #ffffff;

  --green: #0b7a43;   --green-soft: #e1f5e9;
  --red: #d6343a;     --red-soft: #fdeceb;
  --gold: #9a6b00;    --gold-soft: #fbf1d4;

  --bar-muted: #cdd6e5;
  --grid: #e9edf4;
  --axis: #cfd6e4;

  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;

  --shadow-float: 0 18px 50px rgba(20,26,46,.16), 0 3px 10px rgba(20,26,46,.07);
  --shadow-soft: 0 1px 2px rgba(20,26,46,.06);
  --backdrop: rgba(12,16,30,.42);

  --r-xl: 26px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --tabbar-h: 66px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0c1122; --surface: #161c30; --surface-2: #1b2239; --surface-3: #222a45;
    --line: #262e4a; --line-2: #343d5f;
    --ink: #eef1f8; --ink-2: #b4bbd3; --muted: #8891b0;
    --accent: #38bdf8; --accent-ink: #7dd3fc; --accent-soft: rgba(56,189,248,.14); --on-accent: #06243a;
    --green: #3ddc91; --green-soft: rgba(61,220,145,.13);
    --red: #ff6b6e; --red-soft: rgba(255,107,110,.13);
    --gold: #f5c451; --gold-soft: rgba(245,196,81,.13);
    --bar-muted: #34405f; --grid: #222a43; --axis: #343d5f;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --shadow-float: 0 18px 50px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.3);
    --shadow-soft: 0 1px 2px rgba(0,0,0,.3);
    --backdrop: rgba(3,6,16,.62);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0c1122; --surface: #161c30; --surface-2: #1b2239; --surface-3: #222a45;
  --line: #262e4a; --line-2: #343d5f;
  --ink: #eef1f8; --ink-2: #b4bbd3; --muted: #8891b0;
  --accent: #38bdf8; --accent-ink: #7dd3fc; --accent-soft: rgba(56,189,248,.14); --on-accent: #06243a;
  --green: #3ddc91; --green-soft: rgba(61,220,145,.13);
  --red: #ff6b6e; --red-soft: rgba(255,107,110,.13);
  --gold: #f5c451; --gold-soft: rgba(245,196,81,.13);
  --bar-muted: #34405f; --grid: #222a43; --axis: #343d5f;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --shadow-float: 0 18px 50px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.3);
  --shadow-soft: 0 1px 2px rgba(0,0,0,.3);
  --backdrop: rgba(3,6,16,.62);
}

/* ───────────────────────── base ───────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--page); color: var(--ink);
  font: 500 15px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  min-height: 100vh; transition: background-color .25s;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button, a, input, select, textarea, label, .cat, .pill, .tab, .heat-cell, .stack-seg { touch-action: manipulation; }
input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; min-width: 0; display: block; }
input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value { text-align: left; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.emo { font-family: 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; line-height: 1; }

/* ───────────────────────── login ───────────────────────── */
body.booting #loginScreen { visibility: hidden; }
#loginScreen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login { width: 100%; max-width: 400px; }
.login-mark { font-family: var(--font-display); font-weight: 800; font-size: 46px; letter-spacing: -.04em; line-height: 1; }
.login-emoji { font-size: 26px; margin: 14px 0 6px; letter-spacing: 6px; }
.login-line { color: var(--ink-2); font-size: 16px; margin-bottom: 28px; }
.login-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 24px; box-shadow: var(--shadow-soft); }
.login-err { color: var(--red); font-size: 14px; font-weight: 600; margin-top: 12px; }

/* ───────────────────────── shell ───────────────────────── */
#app { display: none; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: var(--page);
  background: color-mix(in srgb, var(--page) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.wordmark { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -.035em; }
.top-actions { display: flex; gap: 8px; }
.round-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; font-size: 17px; font-weight: 800;
  transition: transform .15s var(--ease), background-color .2s;
}
.round-btn:active { transform: scale(.94); }
.avatar { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -8px 28px rgba(20,26,46,.06);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  height: var(--tabbar-h); background: none; border: 0;
  font-size: 11px; font-weight: 700; color: var(--muted); position: relative; white-space: nowrap; min-width: 0;
}
@media (max-width: 360px) { .tab { font-size: 10px; } }
.tab .emo { font-size: 23px; transition: transform .3s var(--ease), filter .2s; filter: grayscale(.85); opacity: .7; }
.tab.active { color: var(--accent-ink); }
.tab.active .emo { transform: translateY(-2px) scale(1.14); filter: none; opacity: 1; }

.rail { display: none; }
main { max-width: 1120px; margin: 0 auto; min-width: 0; overflow-x: clip; padding: 6px 16px calc(var(--tabbar-h) + 104px + env(safe-area-inset-bottom)); }

@media (min-width: 960px) {
  .topbar, .tabbar { display: none; }
  .rail {
    display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; width: 240px;
    padding: 28px 16px 20px; background: var(--surface); border-right: 1px solid var(--line); z-index: 20;
  }
  .rail .wordmark { font-size: 30px; padding: 0 12px; margin-bottom: 28px; }
  .rail-nav { display: flex; flex-direction: column; gap: 4px; }
  .rail-link {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px;
    background: none; border: 0; font-weight: 700; font-size: 15px; color: var(--ink-2); text-align: left;
    transition: background-color .15s, color .15s;
  }
  .rail-link .emo { font-size: 20px; width: 24px; text-align: center; filter: grayscale(.6); transition: filter .2s, transform .25s var(--ease); }
  .rail-link:hover { background: var(--surface-2); color: var(--ink); }
  .rail-link.active { background: var(--accent-soft); color: var(--accent-ink); }
  .rail-link.active .emo { filter: none; transform: scale(1.1); }
  .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
  .rail-user { font-size: 13px; color: var(--muted); padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail-row { display: flex; gap: 8px; }
  main { margin-left: 240px; max-width: none; padding: 34px 44px 72px; }
  .view { max-width: 1100px; }
}

/* ───────────────────────── views ───────────────────────── */
.view-enter { animation: fadeIn .28s ease both; }
.view-enter > :not(.page-head) { animation: viewIn .36s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes fadeIn { from { opacity: 0; } }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 8px 0 14px; }
.page-title { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -.03em; line-height: 1.1; display: flex; align-items: center; gap: 10px; }
.page-title .emo { font-size: 27px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 46px; padding: 0 20px; border-radius: 999px; border: 0;
  font-weight: 800; font-size: 15px; white-space: nowrap;
  transition: transform .15s var(--ease), background-color .2s, box-shadow .2s, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn-soft { background: var(--accent-soft); color: var(--accent-ink); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-gold { background: var(--gold-soft); color: var(--gold); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn.block { width: 100%; height: 54px; font-size: 16px; }
.btn .plus { font-size: 20px; line-height: 1; margin-top: -2px; }

.page-action { box-shadow: var(--shadow-soft); }
.page-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.report-btn { gap: 7px; }
.report-btn .rb-short { display: none; }
@media (max-width: 400px) { .report-btn .rb-long { display: none; } .report-btn .rb-short { display: inline; } }

/* report sheet */
.rp-cards { display: grid; gap: 10px; }
.rp-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 14px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); transition: border-color .15s, background-color .15s; }
.rp-card:hover:not(:disabled) { border-color: var(--line-2); }
.rp-card.on { border-color: var(--accent); background: var(--accent-soft); }
.rp-card:disabled { opacity: .5; cursor: not-allowed; }
.rp-tick { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line-2); display: grid; place-items: center; font-size: 13px; font-weight: 900; color: transparent; transition: background-color .15s, border-color .15s; }
.rp-card.on .rp-tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.rp-emo { font-size: 24px; flex: none; }
.rp-text { display: flex; flex-direction: column; min-width: 0; }
.rp-text b { font-size: 15.5px; }
.rp-text small { font-size: 13px; color: var(--muted); font-weight: 600; }
.rp-check { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; color: var(--ink-2); padding: 6px 2px; cursor: pointer; }
.rp-check input { width: 19px; height: 19px; accent-color: var(--accent); flex: none; }
@media (max-width: 959px) {
  .page-action {
    position: fixed; z-index: 25; right: 16px;
    bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom));
    height: 54px; padding: 0 22px; box-shadow: var(--shadow-float);
  }
}

/* hero */
.hero { margin: 4px 0 22px; }
.hero-label { font-size: 15px; font-weight: 700; color: var(--ink-2); }
.hero-nums { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; margin-top: 2px; }
.hero-num {
  font-family: var(--font-display); font-weight: 700; letter-spacing: -.04em; line-height: 1.04;
  font-size: clamp(42px, 12vw, 64px);
}
.hero-nums.two .hero-num { font-size: clamp(34px, 9.5vw, 52px); }
.hero-num.zero { color: var(--muted); }
.hero-sub { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14.5px; font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; white-space: nowrap; }
.chip.good { background: var(--green-soft); color: var(--green); }
.chip.bad { background: var(--red-soft); color: var(--red); }
.chip.neutral { background: var(--surface-3); color: var(--ink-2); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }

/* joined stat strip */
.stats {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 26px;
}
.stat { background: var(--surface); padding: 14px 16px; min-width: 0; }
.stat-label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.stat-value { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin-top: 2px; overflow-wrap: anywhere; }
.stat-note { font-size: 12.5px; color: var(--muted); margin-top: 1px; font-weight: 600; }
@media (max-width: 759px) { .stats > .stat:last-child:nth-child(odd) { grid-column: 1 / -1; } }
@media (min-width: 760px) { .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } .stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* sections */
.section { margin: 30px 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.section-title { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -.02em; line-height: 1.2; }
.section-note { font-size: 14px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; }
.panel + .panel { margin-top: 14px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.grid-2 > * { min-width: 0; }
@media (min-width: 1080px) { .grid-2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } .grid-2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.stack-tight > * + * { margin-top: 10px; }

/* lists */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 32px; align-items: center; gap: 12px;
  padding: 12px 10px 12px 14px; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row.no-del { grid-template-columns: 44px minmax(0, 1fr) auto; padding-right: 14px; }
.row-new { animation: rowNew 1.6s var(--ease); }
@keyframes rowNew { 0% { background: var(--accent-soft); transform: translateY(-6px); opacity: 0; } 25% { opacity: 1; transform: none; } 100% { background: transparent; } }
.bubble { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-3); display: grid; place-items: center; font-size: 22px; }
.bubble.gold { background: var(--gold-soft); }
.bubble.in { background: var(--green-soft); }
.row-main { min-width: 0; }
.row-title { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: 13px; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub.wrap { white-space: normal; line-height: 1.4; }
.chart-key { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 8px; }
.chart-key i { width: 18px; height: 2px; background: var(--ink-2); border-radius: 2px; }
.chart-key.legend2 { gap: 14px; flex-wrap: wrap; }
.chart-key .sw { display: inline-flex; align-items: center; gap: 6px; }
.chart-key .sw b { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.mode-switch { max-width: 360px; }
.amt { font-weight: 800; font-size: 15.5px; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.amt.in { color: var(--green); }
.pos { color: var(--green); } .neg { color: var(--red); }
.amt-sub { font-size: 12.5px; color: var(--muted); font-weight: 600; text-align: right; white-space: nowrap; }
.amt-sub.shop { color: var(--gold); }
.trm { padding: 0; overflow: hidden; }
.trm-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(84px, auto) minmax(84px, auto); gap: 12px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line); }
.trm-row:last-child { border-bottom: 0; }
.trm-head { background: var(--surface-2); font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding-top: 9px; padding-bottom: 9px; }
.trm-head > :not(:first-child), .trm-num { text-align: right; }
.trm-num { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.trm-num small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; }
.trm-row.mine { background: var(--gold-soft); }
@media (max-width: 420px) { .trm-row { gap: 8px; padding: 10px 12px; grid-template-columns: minmax(0, 1fr) auto auto; } }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--muted);
  display: grid; place-items: center; font-size: 15px; transition: background-color .15s, color .15s;
}
.icon-btn:hover, .icon-btn:focus-visible { background: var(--red-soft); color: var(--red); }
.group-head {
  display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px 8px;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
  font-size: 13.5px; font-weight: 800; color: var(--ink-2);
}
.group-head .gtot { color: var(--muted); font-weight: 700; }

.empty { text-align: center; padding: 34px 18px; color: var(--ink-2); font-weight: 600; }
.empty .emo { font-size: 34px; display: block; margin-bottom: 10px; }
.empty .btn { margin-top: 14px; }

/* date bar */
.datebar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.nav-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 800; display: grid; place-items: center; color: var(--ink-2); }
.nav-btn:active { transform: scale(.94); }
.date-pill {
  position: relative; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; cursor: pointer;
}
.date-pill input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

/* forms */
.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; min-width: 0; }
.field > label, .field-label { font-size: 14px; font-weight: 800; color: var(--ink-2); }
.field-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.input, .select, .textarea {
  width: 100%; height: 50px; border-radius: 13px; border: 1.5px solid var(--line-2);
  background: var(--surface); color: var(--ink); font: 600 16px var(--font-ui); padding: 0 14px;
  transition: border-color .15s, box-shadow .15s;
}
.textarea { height: auto; min-height: 84px; padding: 12px 14px; resize: vertical; line-height: 1.45; }
.select { appearance: none; -webkit-appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px; background-size: 6px 6px; background-repeat: no-repeat; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.input.shake { animation: shake .4s; border-color: var(--red); }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.hint { font-size: 13.5px; color: var(--muted); font-weight: 600; line-height: 1.55; }
.hint.box { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }

.amount-wrap { display: flex; align-items: center; gap: 12px; padding: 4px 0 8px; border-bottom: 2px solid var(--line); margin-bottom: 18px; transition: border-color .2s; }
.amount-wrap:focus-within { border-color: var(--accent); }
.amount-input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-family: var(--font-display); font-weight: 700; font-size: 44px; letter-spacing: -.03em; height: 64px; color: var(--ink); }
.amount-input::placeholder { color: var(--line-2); }

.seg { display: inline-flex; background: var(--surface-3); border-radius: 13px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 0 14px; height: 38px; border-radius: 10px; font-weight: 800; font-size: 14px; color: var(--ink-2); transition: background-color .2s, color .2s, box-shadow .2s; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-soft); }
.seg.full { display: flex; } .seg.full button { flex: 1; }
.seg button.on.out { color: var(--red); } .seg button.on.in { color: var(--green); }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.cat {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  min-height: 78px; padding: 8px 4px; border-radius: 15px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: 12.5px; line-height: 1.2; color: var(--ink-2); text-align: center;
  transition: border-color .15s, background-color .15s, transform .15s var(--ease);
}
.cat .emo { font-size: 25px; }
.cat:active { transform: scale(.95); }
.cat.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.pill-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; color: var(--ink-2);
  transition: border-color .15s, background-color .15s;
}
.pill.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }

/* sheet */
.sheet-wrap { position: fixed; left: 0; right: 0; top: 0; height: 100%; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity .28s; touch-action: none; }
.sheet {
  position: relative; width: 100%; max-width: 560px; max-height: calc(100% - 10px);
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--surface); border-radius: 28px 28px 0 0;
  transform: translateY(100%); transition: transform .34s var(--ease); box-shadow: var(--shadow-float);
}
.sheet.dragging { transition: none; }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.sheet-top { flex: none; padding: 8px 20px 4px; touch-action: none; cursor: grab; }
.grab { width: 42px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto 8px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.sheet-title { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 8px 20px 16px; }
.sheet-foot { flex: none; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--surface); }
.kb-open .sheet-foot { padding-bottom: 12px; }
.foot-row { display: flex; gap: 10px; align-items: center; }
.foot-row .btn { flex: 1; min-width: 0; height: 54px; }
.foot-row .date-chip { height: 54px; flex: none; }
.date-chip { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.date-chip input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
@media (min-width: 960px) {
  .sheet-wrap { align-items: center; padding: 24px; }
  .sheet { border-radius: 28px; max-height: calc(100% - 48px); transform: translateY(18px) scale(.97); opacity: 0; transition: transform .3s var(--ease), opacity .22s; }
  .sheet-wrap.open .sheet { opacity: 1; transform: none; }
  .sheet-top { padding: 20px 26px 4px; cursor: default; }
  .sheet-body { padding: 8px 26px 18px; }
  .sheet-foot { padding: 14px 26px 22px; }
  .grab { display: none; }
}

/* toast */
.toast {
  position: fixed; left: 50%; z-index: 80; bottom: calc(var(--tabbar-h) + 86px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--page); padding: 12px 18px; border-radius: 14px;
  font-weight: 700; font-size: 14.5px; box-shadow: var(--shadow-float); max-width: calc(100vw - 32px);
  transition: transform .3s var(--ease), opacity .25s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.error { background: var(--red); color: #fff; }
.toast.has-act { pointer-events: auto; display: flex; align-items: center; gap: 14px; padding: 8px 8px 8px 18px; }
.toast-act { border: 0; background: color-mix(in srgb, var(--page) 18%, transparent); color: inherit; font-weight: 800; font-size: 14px; height: 34px; padding: 0 14px; border-radius: 10px; }
.toast-act:hover { background: color-mix(in srgb, var(--page) 28%, transparent); }
@media (min-width: 960px) { .toast { bottom: 28px; left: calc(50% + 120px); } }

/* tooltip */
.tip {
  position: fixed; left: 0; top: 0; z-index: 90; pointer-events: none;
  background: var(--ink); color: var(--page); border-radius: 12px; padding: 9px 12px; min-width: 120px; max-width: 260px;
  box-shadow: var(--shadow-float); opacity: 0; transition: opacity .12s;
}
.tip.show { opacity: 1; }
.tip-title { font-size: 12px; font-weight: 700; opacity: .7; margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.tip-row strong { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tip-row span { opacity: .75; }
.tip-key { width: 12px; height: 3px; border-radius: 2px; flex: none; }

/* charts */
.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart svg { display: block; overflow: visible; }
.chart text { font-family: var(--font-ui); font-size: 11.5px; font-weight: 700; fill: var(--muted); }
.chart .lbl-strong { fill: var(--ink); font-size: 12.5px; font-weight: 800; }
.chart .hit { fill: transparent; cursor: pointer; outline: none; }
.chart .bar { transition: opacity .15s; }
.chart.has-hot .bar:not(.hot) { opacity: .45; }
.animate .grow-y { animation: growY .75s var(--ease) both; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes growY { from { transform: scaleY(0); } }
.animate .grow-x { animation: growX .85s var(--ease) both; transform-origin: 0 50%; }
@keyframes growX { from { transform: scaleX(0); } }
.animate .draw { animation: draw 1.2s var(--ease) both; }
@keyframes draw { from { stroke-dashoffset: var(--len); } }
.animate .pop { animation: pop .5s var(--ease) both; animation-delay: .9s; }
@keyframes pop { from { opacity: 0; transform: scale(.4); } }
.animate .fade-in { animation: fadeIn .5s ease both; }

/* category bars */
.cbars { display: flex; flex-direction: column; gap: 14px; }
.cbar-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.cbar-emo { font-size: 20px; width: 26px; text-align: center; flex: none; }
.cbar-name { flex: 1; min-width: 0; font-weight: 700; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbar-name small { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.cbar-val { font-weight: 800; font-size: 14.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cbar-track { display: flex; align-items: center; gap: 10px; padding-left: 36px; }
.cbar-bg { flex: 1; height: 8px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.cbar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
.cbar-fill.gold { background: var(--gold); }
.cbar-pct { font-size: 12.5px; color: var(--muted); font-weight: 700; width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

/* stacked bar */
.stack { display: flex; gap: 2px; height: 18px; border-radius: 999px; overflow: hidden; margin: 6px 0 14px; }
.stack-seg { min-width: 4px; height: 100%; cursor: pointer; transition: opacity .15s, filter .15s; outline: none; }
.stack:hover .stack-seg:not(:hover) { opacity: .55; }
.stack-seg:focus-visible { filter: brightness(1.15); }
.legend { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
@media (min-width: 640px) { .legend.cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 24px; } }
.legend-row { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; min-width: 0; }
.swatch { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.legend-row .lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-row .lval { font-variant-numeric: tabular-nums; white-space: nowrap; }
.legend-row .lpct { color: var(--muted); width: 48px; text-align: right; font-variant-numeric: tabular-nums; }

/* heat calendar */
.heat { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.heat-dow { text-align: center; font-size: 11.5px; font-weight: 800; color: var(--muted); padding-bottom: 2px; }
.heat-cell {
  position: relative; aspect-ratio: 1; border-radius: 9px; background: var(--surface-3); overflow: hidden;
  display: grid; place-items: center; font-size: 11.5px; font-weight: 800; color: var(--ink-2); outline: none; cursor: pointer;
}
.heat-cell .fill { position: absolute; inset: 0; background: var(--accent); }
.heat-cell .d { position: relative; }
.heat-cell.dark .d { color: var(--on-accent); }
.heat-cell.future { background: transparent; border: 1px dashed var(--line-2); color: var(--muted); cursor: default; }
.heat-cell.blank { background: transparent; cursor: default; }
.heat-cell:focus-visible { box-shadow: 0 0 0 2px var(--ink); }
.animate .heat-cell .fill { animation: fadeIn .6s ease both; animation-delay: calc(var(--i) * 14ms); }
.heat-legend { display: flex; align-items: center; gap: 5px; justify-content: flex-end; margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
.heat-legend i { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); display: inline-block; }

/* meters */
.meter { padding: 4px 0 2px; }
.meter + .meter { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.meter-label { font-weight: 800; font-size: 15px; }
.meter-val { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.meter-track { position: relative; height: 10px; border-radius: 999px; background: var(--accent-soft); margin: 10px 0 8px; }
.meter-fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }
.meter-mark { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); border-radius: 2px; }
.meter-note { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); font-weight: 600; }

/* filters */
.filters { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.scroller::-webkit-scrollbar { display: none; }
.scroller .pill { flex: none; }
@media (min-width: 960px) { .scroller { margin: 0; padding: 2px 0; flex-wrap: wrap; overflow: visible; } }
.filter-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.caption { font-size: 14px; color: var(--muted); font-weight: 600; }
.currency-bar { margin: 0 0 20px; }
.currency-bar .seg button { min-width: 44px; font-size: 16px; }

/* converter */
.cv-top { display: flex; align-items: center; gap: 12px; padding: 2px 0 8px; border-bottom: 2px solid var(--line); margin-bottom: 14px; transition: border-color .2s; }
.cv-top:focus-within { border-color: var(--accent); }
.cv-top .seg button { min-width: 40px; font-size: 16px; }
.cv-input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: -.03em; height: 52px; color: var(--ink); }
.cv-input::placeholder { color: var(--line-2); }
.cv-list { display: flex; flex-direction: column; gap: 8px; }
.cv-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border: 0; border-radius: 13px; background: var(--surface-2); text-align: left; transition: background-color .15s; }
.cv-row:hover { background: var(--surface-3); }
.cv-row .cur-sym { flex: none; }
.cv-name { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.cv-rate { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.cv-val { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* holdings */
.hold-head, .hold-row { display: grid; align-items: center; gap: 6px 12px; padding: 13px 14px; }
.hold-head { display: none; }
.hold-row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "tick value" "meta gain" "price price"; border-bottom: 1px solid var(--line); }
.hold-row:last-child { border-bottom: 0; }
.h-tick { grid-area: tick; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; min-width: 0; }
.h-meta { grid-area: meta; font-size: 13px; color: var(--muted); font-weight: 600; }
.h-value { grid-area: value; font-weight: 800; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; }
.h-gain { grid-area: gain; text-align: right; }
.h-price { grid-area: price; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-weight: 600; padding-top: 4px; }
.h-shares, .h-netin, .h-avg, .h-weight, .h-pct { display: none; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.px-input, .bal-input {
  width: 108px; height: 38px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--surface-2);
  color: var(--ink); font: 800 16px var(--font-ui); text-align: right; padding: 0 10px; font-variant-numeric: tabular-nums;
}
.px-input:focus, .bal-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
@media (min-width: 900px) {
  .hold-head, .hold-row {
    grid-template-columns: minmax(90px,1.1fr) .6fr 1fr 1fr 1.05fr 1fr 1.1fr .7fr .7fr;
    grid-template-areas: none;
  }
  .hold-head { display: grid; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 800; color: var(--muted); padding-top: 10px; padding-bottom: 10px; }
  .hold-head > *:not(:first-child), .hold-row > *:not(.h-tick) { text-align: right; justify-content: flex-end; }
  .h-tick, .h-shares, .h-netin, .h-avg, .h-price, .h-value, .h-gain, .h-pct, .h-weight { grid-area: auto; }
  .h-meta { display: none; }
  .h-shares, .h-netin, .h-avg, .h-weight, .h-pct { display: block; font-variant-numeric: tabular-nums; font-weight: 700; }
  .h-price { padding-top: 0; }
  .h-price .plabel { display: none; }
  .h-value { font-size: 15px; }
}

.side-pill { font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
.side-pill.buy { background: var(--green-soft); color: var(--green); }
.side-pill.sell { background: var(--red-soft); color: var(--red); }
.badge { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); margin-left: 6px; vertical-align: 2px; }
.badge.gold { background: var(--gold-soft); color: var(--gold); }

.thesis { padding: 16px; border-bottom: 1px solid var(--line); }
.thesis:last-child { border-bottom: 0; }
.thesis-top { display: flex; align-items: center; gap: 10px; }
.thesis-tick { font-weight: 800; font-size: 16px; color: var(--accent-ink); }
.thesis-co { flex: 1; min-width: 0; color: var(--ink-2); font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thesis p { margin-top: 8px; font-size: 14.5px; color: var(--ink-2); line-height: 1.6; max-width: 72ch; }
.thesis .sell { color: var(--muted); font-size: 13.5px; }

.cur-block + .cur-block { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
.cur-head { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; margin-bottom: 12px; }
.cur-sym { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; }
.mini3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
.mini { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.mini-l { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.mini-v { font-size: 15.5px; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.mini-v.in { color: var(--green); } .mini-v.bad { color: var(--red); }

.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.month-nav .t { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
.month-nav .btns { display: flex; gap: 6px; }

.price-line { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.price-line .field { flex: 1 1 140px; margin-bottom: 0; }

.callout { display: flex; gap: 14px; align-items: flex-start; background: var(--accent-soft); border-radius: var(--r-lg); padding: 16px 18px; margin-bottom: 22px; }
.callout .emo { font-size: 26px; }
.callout-title { font-weight: 800; font-size: 15.5px; color: var(--ink); }
.callout p { font-size: 14px; color: var(--ink-2); font-weight: 600; margin-top: 2px; }

.foot-note { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 10px; line-height: 1.55; }
.more-btn { display: block; width: 100%; padding: 13px; background: var(--surface-2); border: 0; border-top: 1px solid var(--line); font-weight: 800; color: var(--accent-ink); font-size: 14px; }

/* trades filter */
.tr-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.tr-pick { display: flex; align-items: center; gap: 10px; flex: 0 1 300px; min-width: 0; }
.tr-pick .caption { flex: none; }
.tr-pick .select { flex: 1; min-width: 0; height: 46px; font-weight: 700; }
@media (max-width: 520px) { .tr-pick { flex-basis: 100%; } }
.tr-sum { margin-bottom: 14px; }
.tr-sum .foot-note { margin-top: 8px; }
.tick-link { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline dotted var(--line-2); text-underline-offset: 4px; }
.tick-link:hover { color: var(--accent-ink); text-decoration-color: currentColor; }

/* nav badge */
.nav-badge { min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: #1c1400; font-size: 11px; font-weight: 800; display: inline-grid; place-items: center; line-height: 1; }
.nav-badge.late { background: var(--red); color: #fff; }
.rail-link .nav-badge { margin-left: auto; }
.tab .nav-badge { position: absolute; top: 7px; left: calc(50% + 7px); }

/* ───────────────────────── missions ───────────────────────── */
.chip.sm { padding: 2px 8px; font-size: 11.5px; }

/* trades, with a filter by ticker and by buy or sell */
function filterTrades(ticker) {
  ui.tradeTicker = ticker; ui.tradeSide = 'all'; ui.showAllTrades = false;
  renderInvest();
  requestAnimationFrame(() => $('tradesSec')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }));
}
function tradesSection() {
  const all = cache.trades;
  const tickers = [...new Set(all.map(t => t.ticker))].sort((a, b) => a.localeCompare(b));
  if (ui.tradeTicker !== 'all' && !tickers.includes(ui.tradeTicker)) ui.tradeTicker = 'all';
  const byTicker = ui.tradeTicker === 'all' ? all : all.filter(t => t.ticker === ui.tradeTicker);
  const hasSells = byTicker.some(t => t.side === 'Sell');
  if (!hasSells) ui.tradeSide = 'all';
  const rows = ui.tradeSide === 'all' ? byTicker : byTicker.filter(t => t.side === ui.tradeSide);
  const filtered = ui.tradeTicker !== 'all' || ui.tradeSide !== 'all';
  const rerender = () => { ui.showAllTrades = false; renderInvest(); };

  const count = tk => all.filter(t => t.ticker === tk).length;
  /* a dropdown, A to Z, so it stays tidy however many stocks you own */
  const bar = tickers.length > 1 ? h('label', { class: 'tr-pick' },
    h('span', { class: 'caption' }, 'Stock'),
    h('select', { class: 'select', 'aria-label': 'Filter trades by stock', onchange: e => { ui.tradeTicker = e.target.value; rerender(); } },
      h('option', { value: 'all', selected: ui.tradeTicker === 'all' || null }, 'All stocks (' + all.length + ')'),
      tickers.map(tk => h('option', { value: tk, selected: ui.tradeTicker === tk || null }, tk + ' (' + count(tk) + ')')))) : null;
  const sideSeg = hasSells ? seg([['all', 'All'], ['Buy', 'Buys'], ['Sell', 'Sells']], ui.tradeSide, v => { ui.tradeSide = v; rerender(); }) : null;

  const list = h('div', { class: 'list' });

  else if (!rows.length) list.appendChild(empty('🔍', 'No ' + (ui.tradeSide === 'Sell' ? 'sells' : 'buys') + ' for ' + ui.tradeTicker + '.'));
  else {
    const shownRows = ui.showAllTrades ? rows : rows.slice(0, filtered ? 12 : 6);

        ui.showAllTrades ? 'Show fewer' : 'Show all ' + rows.length + ' trades'));
  }

  const sec = sectionWith('Trades', filtered ? rows.length + ' of ' + all.length + ' trades' : null,
    filtered ? h('button', { class: 'btn btn-ghost sm', onclick: () => { ui.tradeTicker = 'all'; ui.tradeSide = 'all'; rerender(); } }, 'Clear filter') : null,
    bar || sideSeg ? h('div', { class: 'tr-tools' }, bar, sideSeg) : null,

/* a short story for one ticker: how much you bought, at what average, first and last time */
function tickerSummary(tk, rows) {
  const buys = rows.filter(t => t.side !== 'Sell'), sells = rows.filter(t => t.side === 'Sell');
  const sum = (arr, f) => arr.reduce((a, t) => a + f(t), 0);
  const boughtQty = sum(buys, t => num(t.quantity)), soldQty = sum(sells, t => num(t.quantity));
  const spent = sum(buys, t => tradeMath(t).total), got = sum(sells, t => -tradeMath(t).total);
  const avg = boughtQty ? sum(buys, t => num(t.quantity) * num(t.price_per_share)) / boughtQty : 0;
  const fees = sum(rows, t => tradeMath(t).comm);
  const dates = rows.map(t => String(t.trade_date)).sort();
  const span = dates.length > 1 ? 'From ' + fmtDate(dates[0]) + ' to ' + fmtDate(dates[dates.length - 1]) : 'On ' + fmtDate(dates[0]);
  const held = boughtQty - soldQty;
  return h('div', { class: 'tr-sum' },
    h('div', { class: 'stats four' },
      stat('Bought', qty(boughtQty) + (boughtQty === 1 ? ' share' : ' shares'), buys.length + (buys.length === 1 ? ' buy' : ' buys') + ', ' + money(spent, 'USD') + ' with fees'),
      stat('Average buy price', money(avg, 'USD'), 'per share, before fees'),
      sells.length ? stat('Sold', qty(soldQty) + (soldQty === 1 ? ' share' : ' shares'), sells.length + (sells.length === 1 ? ' sell' : ' sells') + ', ' + money(got, 'USD') + ' after fees')
        : stat('Still holding', qty(held) + (held === 1 ? ' share' : ' shares'), 'never sold'),
      stat('Fees paid', money(fees, 'USD'), rows.length + (rows.length === 1 ? ' trade' : ' trades'))),
    h('div', { class: 'foot-note' }, span + '.' + (sells.length ? (held > 1e-9 ? ' You still hold ' + qty(held) + (held === 1 ? ' share.' : ' shares.') : ' You sold all of it.') : '')));
}

/* A dashboard you can click through: pick a period, filter by category or subcategory,

const RANGE_KINDS = [['week', 'Week'], ['month', 'Month'], ['year', 'Year'], ['roll', 'Last days'], ['all', 'All time'], ['custom', 'Custom']];
const ROLL_DAYS = [7, 14, 30, 90, 180, 365];
function normRange(r) {
  r = { kind: 'month', anchor: null, days: 30, from: null, to: null, ...(r || {}) };
  const old = { last7: 7, last30: 30, last90: 90 }[r.kind];
  if (old) { r.kind = 'roll'; r.days = old; }
  if (r.kind === 'lastmonth') { r.kind = 'month'; r.anchor = addMonths(todayStr().slice(0, 7), -1) + '-15'; }
  if (!RANGE_KINDS.some(([k]) => k === r.kind)) r.kind = 'month';
  return r;
}
range = normRange(range);
function saveRange() { save('ledger.range', range); anDay = null; anLimit = 30; renderAnalysis(); }
const shortDate = (s, withYear) => dateOf(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', ...(withYear ? { year: 'numeric' } : {}) });
function currentRange() {
  const t = todayStr(), a = range.anchor && range.anchor <= t ? range.anchor : t;
  switch (range.kind) {
    case 'week': {
      const f = startOfWeek(a), cur = f === startOfWeek(t);
      return { from: f, to: shiftDays(f, 6), label: cur ? 'This week' : shortDate(f) + ' to ' + shortDate(shiftDays(f, 6), true), current: cur };
    }
    case 'year': { const y = a.slice(0, 4); return { from: y + '-01-01', to: y + '-12-31', label: y, current: y === t.slice(0, 4) }; }
    case 'roll': { const n = range.days || 30; return { from: shiftDays(t, -(n - 1)), to: t, label: 'Last ' + n + ' days', current: true }; }
    case 'all': { const ds = cache.entries.map(e => e.date).sort(); return { from: ds[0] || t, to: t, label: 'All time', current: true }; }
    case 'custom': {
      let f = range.from || shiftDays(t, -29), to = range.to || t;
      if (f > to) [f, to] = [to, f];
      return { from: f, to, label: shortDate(f, f.slice(0, 4) !== to.slice(0, 4)) + ' to ' + shortDate(to, true), current: to >= t };
    }
    default: { const ym = a.slice(0, 7), m = monthBounds(ym); return { from: m.first, to: m.last, label: monthLabel(ym), current: ym === t.slice(0, 7) }; }
  }
}
function stepRange(dir) {
  const t = todayStr(), a = range.anchor && range.anchor <= t ? range.anchor : t;
  if (range.kind === 'week') range.anchor = shiftDays(a, 7 * dir);
  else if (range.kind === 'month') range.anchor = addMonths(a.slice(0, 7), dir) + '-15';
  else if (range.kind === 'year') range.anchor = (Number(a.slice(0, 4)) + dir) + '-06-15';

  saveRange();
}
function zoomTo(kind, day) { range.kind = kind; range.anchor = day >= todayStr() ? null : day; saveRange(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function periodPhrase(r, verb = 'Spent') {
  switch (range.kind) {
    case 'week': return verb + (r.current ? ' this week' : ' that week');
    case 'roll': return verb + ' in the last ' + (range.days || 30) + ' days';
    case 'all': return verb + ' in total';
    case 'custom': return verb + ' in this period';

}
function effTo(r) { const t = todayStr(); return r.to < t ? r.to : t; }
/* the period before, cut to the same number of days when this one is not over yet */
function previousRange(r, full = false) {
  const end = effTo(r);
  if (range.kind === 'all' || end < r.from) return null;
  const partial = !full && end < r.to;
  if (range.kind === 'month') {
    const pym = addMonths(r.from.slice(0, 7), -1), pb = monthBounds(pym);
    if (!partial) return { from: pb.first, to: pb.last, label: monthLabel(pym) };
    const dayN = Math.min(Number(end.slice(8, 10)), Number(pb.last.slice(8, 10)));
    return { from: pb.first, to: pym + '-' + String(dayN).padStart(2, '0'), label: 'the same days last month', short: monthShort(pym) };
  }
  if (range.kind === 'year') {
    const py = String(Number(r.from.slice(0, 4)) - 1);
    return partial ? { from: py + '-01-01', to: py + end.slice(4), label: 'the same point last year', short: py } : { from: py + '-01-01', to: py + '-12-31', label: py, short: py };

function spendRows(from, to) { return cache.entries.filter(e => e.type === 'expense' && e.date >= from && e.date <= to); }

const SUBSEP = ' › ';
const subKey = (c, sub) => (c || 'Other') + SUBSEP + sub;
function fState() {
  const k = anMode === 'income' ? 'income' : 'spend';
  if (!anFilter[k]) anFilter[k] = { cats: [], subs: [] };

}
function setFilter(cats, subs) { const f = fState(); f.cats = cats; f.subs = subs; save('ledger.anFilter', anFilter); anDay = null; anLimit = 30; renderAnalysis(); }
const catOn = () => { const f = fState(); return f.cats.length + f.subs.length > 0; };

}

/* every category with its subcategories, from your lists and from what you logged */
function catTree(type) {
  const tree = new Map();
  (type === 'expense' ? EXPENSE_CATS : INCOME_CATS).forEach(c => tree.set(c, new Set(c === 'Trip' ? [] : (SUBCATS[c] || []))));
  cache.entries.filter(e => e.type === type).forEach(e => {

function deltaChip(now, before, upIsGood) {
  if (before === null || before === undefined) return null;
  if (before <= 0) return now > 0 ? h('span', { class: 'chip neutral' }, 'nothing before') : null;
  const d = (now - before) / before * 100;
  if (Math.abs(d) < 1) return h('span', { class: 'chip neutral' }, 'about the same');
  return h('span', { class: 'chip ' + ((d > 0) === upIsGood ? 'good' : 'bad') }, (d > 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(0) + '%');
}

/* running total this period against the period before, day by day */
function paceSeries(r, end, prev, b) {
  const cum = (from, to, stop) => {
    const byD = new Map();
    spendRows(from, to).filter(matchAll).forEach(e => { const v = inBase(e, b); if (Number.isFinite(v)) byD.set(e.date, (byD.get(e.date) || 0) + v); });
    const out = []; let run = 0;

    return out;
  };

}
function paceChart({ now, before, from, prevFrom, cur, nowName, beforeName, height = 220 }) {
  return chart((W, H, box) => {

    const iw = W - padL - padR, ih = H - padT - padB;

    const max = Math.max(1, ...now, ...before);
    const step = niceStep(max, 3), yMax = Math.ceil(max / step) * step;
    const x = i => padL + (len <= 1 ? iw / 2 : i / (len - 1) * iw);
    const y = v => padT + ih - v / yMax * ih;
    const svg = s('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
    for (let t = 0; t <= yMax + 1e-9; t += step) {
      svg.appendChild(s('line', { x1: padL, x2: W - padR, y1: y(t), y2: y(t), style: { stroke: t === 0 ? 'var(--axis)' : 'var(--grid)', strokeWidth: 1 } }));
      svg.appendChild(s('text', { x: padL - 8, y: y(t) + 4, 'text-anchor': 'end' }, compact(t, cur)));
    }
    svg.appendChild(s('text', { x: padL, y: H - 7, 'text-anchor': 'start' }, 'Day 1'));
    svg.appendChild(s('text', { x: W - padR, y: H - 7, 'text-anchor': 'end' }, 'Day ' + len));
    const path = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(v).toFixed(1)).join('');
    if (before.length) svg.appendChild(s('path', { d: path(before), style: { fill: 'none', stroke: 'var(--muted)', strokeWidth: 2, strokeDasharray: '5 4', strokeLinejoin: 'round' } }));
    if (now.length) {
      svg.appendChild(s('path', { d: path(now) + `L${x(now.length - 1).toFixed(1)},${y(0)}L${x(0)},${y(0)}Z`, style: { fill: 'var(--accent)', opacity: 0.12 } }));
      svg.appendChild(s('path', { d: path(now), style: { fill: 'none', stroke: 'var(--accent)', strokeWidth: 2.5, strokeLinejoin: 'round', strokeLinecap: 'round' } }));
      svg.appendChild(s('circle', { cx: x(now.length - 1), cy: y(now[now.length - 1]), r: 5, style: { fill: 'var(--accent)', stroke: 'var(--surface)', strokeWidth: 2 } }));
    }
    const cross = s('line', { y1: padT, y2: padT + ih, style: { stroke: 'var(--ink-2)', strokeWidth: 1, opacity: 0, pointerEvents: 'none' } });
    svg.appendChild(cross);
    const hit = s('rect', { x: padL - 10, y: padT, width: iw + 20, height: ih, class: 'hit' });
    const at = cx => Math.max(0, Math.min(len - 1, Math.round((cx - padL) / (iw || 1) * (len - 1))));
    const show = i => {
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.style.opacity = 1;
      const rr = svg.getBoundingClientRect();
      const rowsT = [];
      if (i < now.length) rowsT.push({ value: money(now[i], cur), label: nowName + ', by ' + shortDate(shiftDays(from, i)) });
      if (i < before.length) rowsT.push({ value: money(before[i], cur), label: beforeName + ', by ' + shortDate(shiftDays(prevFrom, i)) });
      showTip(rr.left + x(i), rr.top + y(Math.max(now[Math.min(i, now.length - 1)] || 0, before[Math.min(i, before.length - 1)] || 0)), { title: 'Day ' + (i + 1), rows: rowsT });

    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', e => { e.stopPropagation(); move(e); });
    hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { cross.style.opacity = 0; hideTip(); } });
    svg.appendChild(hit);
    return svg;

/* clicks on chart parts: a click with a mouse, two taps on a touch screen (the first shows the numbers) */
function pickable(el, fn) {
  if (!fn) return;
  let armed = false, kind = null, timer = null;
  el.classList.add('pickable');
  el.addEventListener('pointerdown', e => {
    kind = e.pointerType;
    if (kind === 'mouse') return;
    if (armed) { armed = false; clearTimeout(timer); fn(); }
    else { armed = true; clearTimeout(timer); timer = setTimeout(() => { armed = false; }, 2500); }
  });
  el.addEventListener('click', () => { if (kind === 'mouse' || kind === null) fn(); kind = null; });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); fn(); } });
}

function buckets(from, to, byDate) {
  const n = daysBetween(from, to) + 1;
  const items = [];
  if (n <= 0) return { items, unit: 'day', unitTitle: 'by day' };
  if (n <= 62) {
    for (let d = from; d <= to; d = shiftDays(d, 1)) items.push({ label: String(Number(d.slice(8))), title: fmtDay(d), value: byDate.get(d) || 0, date: d, highlight: d === anDay });
    return { items, unit: 'day', unitTitle: 'by day' };
  }
  if (n <= 400) {
    for (let w = startOfWeek(from); w <= to; w = shiftDays(w, 7)) {
      let v = 0; for (let i = 0; i < 7; i++) { const d = shiftDays(w, i); if (d >= from && d <= to) v += byDate.get(d) || 0; }
      items.push({ label: dateOf(w).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }), title: 'Week of ' + fmtDate(w), value: v, date: w });
    }
    return { items, unit: 'week', unitTitle: 'by week' };
  }
  for (let ym = from.slice(0, 7); ym <= to.slice(0, 7); ym = addMonths(ym, 1)) {
    const mb = monthBounds(ym); let v = 0;
    byDate.forEach((val, d) => { if (d >= mb.first && d <= mb.last) v += val; });
    items.push({ label: monthShort(ym), title: monthLabel(ym), value: v, date: ym + '-15' });
  }
  return { items, unit: 'month', unitTitle: 'by month' };
}

/* ── dates ── */
function nextWeekday(from, wd) { const d = dateOf(from); const diff = (wd - d.getDay() + 7) % 7; d.setDate(d.getDate() + diff); return iso(d); }
function addMonthsKeepDay(s, n) {
  const d = dateOf(s), day = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, last)); return iso(d);
}
function nextDue(s, rep) {
  const t = todayStr();
  const step = d => rep === 'daily' ? shiftDays(d, 1) : rep === 'weekly' ? shiftDays(d, 7) : addMonthsKeepDay(d, 1);
  let n = step(s);
  for (let i = 0; i < 400 && n < t; i++) n = step(n);   // an old repeating mission jumps to the next date that is still ahead
  return n;
}
function quickDates() {
  const t = todayStr();
  const sat = nextWeekday(t, 6);
  return [['', 'No date'], [t, 'Today'], [shiftDays(t, 1), 'Tomorrow'], [sat === t ? t : sat, 'Weekend'], [shiftDays(startOfWeek(t), 7), 'Next week']];
}
function mDayTitle(d) { const t = todayStr(); return d === shiftDays(t, 1) ? 'Tomorrow' : dayTitle(d); }
function dayPhrase(d) { const t = mDayTitle(d); return ['Today', 'Tomorrow', 'Yesterday'].includes(t) ? t.toLowerCase() : 'on ' + t + (d.slice(0, 4) !== todayStr().slice(0, 4) ? ' ' + d.slice(0, 4) : ''); }
function fmtTime(t) { return t ? String(t).slice(0, 5) : ''; }

/* ── quick add: "Ethics form fri 5pm #uni !" ── */
function parseQuick(text) {
  const out = { area: null, priority: null, due_date: null, due_time: null };
  let s = ' ' + text.replace(/\s+/g, ' ') + ' ';
  const t = todayStr();
  const take = (re, fn) => { s = s.replace(re, (...m) => { const r = fn(...m); return r === false ? m[0] : ' '; }); };

  take(/\s#([\p{L}\d]+)(?=\s)/giu, (m, tag) => { const a = M_ALIAS[tag.toLowerCase()]; if (!a) return false; out.area = a; });
  take(/\s!(high|h|urgent|low|l)?(?=\s)/gi, (m, w) => { out.priority = w && /^l/i.test(w) ? 3 : 1; });
  take(/\s!!+(?=\s)/g, () => { out.priority = 1; });

  const pre = '(?:(?:by|on|due|until|till)\\s+)?';
  // times: at 9, 9am, 3:30pm, 14:00
  take(new RegExp('\\s(?:at\\s+)?(\\d{1,2})(?::(\\d{2}))?\\s?(am|pm)(?=\\s)', 'gi'), (m, hh, mm, ap) => {
    let H = Number(hh) % 12; if (/pm/i.test(ap)) H += 12; if (H > 23) return false;
    out.due_time = String(H).padStart(2, '0') + ':' + (mm || '00');
  });
  take(/\s(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)(?=\s)/g, (m, hh, mm) => { out.due_time = hh.padStart(2, '0') + ':' + mm; });
  take(/\sat\s+([01]?\d|2[0-3])(?=\s)/gi, (m, hh) => { out.due_time = hh.padStart(2, '0') + ':00'; });

  const setDate = d => { if (!out.due_date) out.due_date = d; };
  take(new RegExp('\\s' + pre + '(today|tonight|tdy)(?=\\s)', 'gi'), () => setDate(t));
  take(new RegExp('\\s' + pre + '(tomorrow|tmr|tmrw|tomoz)(?=\\s)', 'gi'), () => setDate(shiftDays(t, 1)));
  take(new RegExp('\\s' + pre + '(?:the\\s+)?(?:this\\s+)?weekend(?=\\s)', 'gi'), () => setDate(nextWeekday(t, 6)));
  take(new RegExp('\\s' + pre + 'next\\s+week(?=\\s)', 'gi'), () => setDate(shiftDays(startOfWeek(t), 7)));
  take(new RegExp('\\s' + pre + 'next\\s+month(?=\\s)', 'gi'), () => setDate(addMonths(t.slice(0, 7), 1) + '-01'));
  take(new RegExp('\\s' + pre + 'in\\s+(\\d{1,3}|a|one|two|three)\\s+(day|days|week|weeks|month|months)(?=\\s)', 'gi'), (m, n, u) => {
    const k = { a: 1, one: 1, two: 2, three: 3 }[n.toLowerCase()] || Number(n);
    setDate(/^m/i.test(u) ? addMonthsKeepDay(t, k) : shiftDays(t, /^w/i.test(u) ? k * 7 : k));
  });
  take(new RegExp('\\s' + pre + '(next\\s+)?(' + Object.keys(DAY_NAMES).join('|') + ')(?=\\s)', 'gi'), (m, nx, dn) => {
    let d = nextWeekday(t, DAY_NAMES[dn.toLowerCase()]);
    if (nx && startOfWeek(d) === startOfWeek(t)) d = shiftDays(d, 7);
    setDate(d);
  });
  const fixYear = (mo, dd, yy) => {
    let y = yy ? (yy.length === 2 ? 2000 + Number(yy) : Number(yy)) : Number(t.slice(0, 4));
    const mk = () => y + '-' + String(mo + 1).padStart(2, '0') + '-' + String(dd).padStart(2, '0');
    if (dd < 1 || dd > 31 || mo < 0 || mo > 11) return false;
    let d = mk();
    if (!yy && daysBetween(d, t) > 60) { y++; d = mk(); }   // a date a few weeks back stays this year, so it shows as late
    if (iso(dateOf(d)) !== d) return false;   // 31 Feb and friends
    setDate(d);
  };
  const months = Object.keys(MONTH_NAMES).join('|');
  take(new RegExp('\\s' + pre + '(\\d{1,2})(?:st|nd|rd|th)?\\s+(' + months + ')(?:\\s+(\\d{4}))?(?=\\s)', 'gi'), (m, dd, mo, yy) => fixYear(MONTH_NAMES[mo.toLowerCase()], Number(dd), yy));
  take(new RegExp('\\s' + pre + '(' + months + ')\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:\\s+(\\d{4}))?(?=\\s)', 'gi'), (m, mo, dd, yy) => fixYear(MONTH_NAMES[mo.toLowerCase()], Number(dd), yy));
  take(new RegExp('\\s' + pre + '(\\d{1,2})[/.](\\d{1,2})(?:[/.](\\d{2,4}))?(?=\\s)', 'g'), (m, dd, mm, yy) => fixYear(Number(mm) - 1, Number(dd), yy));

  if (out.due_time && !out.due_date) out.due_date = t;
  out.title = s.replace(/\s+(by|on|due)\s*$/i, ' ').replace(/\s+/g, ' ').trim();
  return out;
}

/* ── how a mission's deadline reads ── */
function dueInfo(m) {
  if (!m.due_date) return null;
  const t = todayStr(), d = daysBetween(t, m.due_date), tm = fmtTime(m.due_time);
  const full = fmtDate(m.due_date) + (tm ? ' at ' + tm : '');
  if (m.status === 'done') return { text: dateOf(m.due_date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }), cls: 'neutral', full };
  if (d < 0) return { text: d === -1 ? 'Yesterday' : Math.abs(d) + ' days late', cls: 'bad', full: full + ', ' + Math.abs(d) + (d === -1 ? ' day' : ' days') + ' ago' };
  if (d === 0) {
    const late = tm && tm < new Date().toTimeString().slice(0, 5);
    return { text: (tm ? tm : 'Today') + (late ? ', late' : ''), cls: late ? 'bad' : 'gold', full: 'Today' + (tm ? ' at ' + tm : '') };
  }
  if (d === 1) return { text: 'Tomorrow' + (tm ? ' ' + tm : ''), cls: 'accent', full: full + ', in 1 day' };
  const label = d < 7 ? dateOf(m.due_date).toLocaleDateString('en-GB', { weekday: 'short' })
    : dateOf(m.due_date).toLocaleDateString('en-GB', d > 300 ? { day: 'numeric', month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' });
  return { text: label + (tm ? ' ' + tm : ''), cls: 'neutral', full: full + ', in ' + d + ' days' };
}
function mBucket(m, t) {
  if (!m.due_date) return 'none';
  const d = daysBetween(t, m.due_date);
  if (d < 0) return 'overdue';
  if (d === 0) return 'today';
  if (d === 1) return 'tomorrow';
  const endWeek = shiftDays(startOfWeek(t), 6);
  if (m.due_date <= endWeek) return 'week';
  if (m.due_date <= shiftDays(endWeek, 7)) return 'next';
  return 'later';
}
const mSort = (a, b) =>
  (a.due_date || '9999').localeCompare(b.due_date || '9999') ||
  (fmtTime(a.due_time) || '99').localeCompare(fmtTime(b.due_time) || '99') ||
  (a.priority - b.priority) || (a.status === 'doing' ? -1 : 0) - (b.status === 'doing' ? -1 : 0) ||
  (a.created_at || '').localeCompare(b.created_at || '');
const doneDay = m => m.done_at ? new Date(m.done_at).toLocaleDateString('en-CA') : null;
function missionCounts() {
  const t = todayStr(), open = cache.missions.filter(m => m.status !== 'done');
  return {
    open: open.length,
    overdue: open.filter(m => m.due_date && m.due_date < t).length,

async function setMissionStatus(m, status) {

async function completeMission(m, { forGood = false } = {}) {
  if (m.status === 'done') return setMissionStatus(m, 'todo');

  const undo = { label: 'Undo', onclick: () => mPatch(m.id, before) };

    if (!ok) return;

  }
  const ok = await mPatch(m.id, { status: 'done', done_at: new Date().toISOString(), repeat: null });

/* ── add to phone calendar (.ics) so it can remind you ── */
function icsFor(m) {
  const esc = v => String(v || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, x => '\\' + x);
  const ymd = d => d.replace(/-/g, '');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Ledger//Missions//EN', 'CALSCALE:GREGORIAN', 'BEGIN:VEVENT',
    'UID:' + m.id + '@ledger', 'DTSTAMP:' + stamp];
  const tm = fmtTime(m.due_time);
  if (tm) {
    const start = dateOf(m.due_date); start.setHours(Number(tm.slice(0, 2)), Number(tm.slice(3, 5)), 0, 0);
    const end = new Date(start.getTime() + 3600000);
    const f = d => iso(d).replace(/-/g, '') + 'T' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '00';
    lines.push('DTSTART:' + f(start), 'DTEND:' + f(end));
  } else lines.push('DTSTART;VALUE=DATE:' + ymd(m.due_date), 'DTEND;VALUE=DATE:' + ymd(shiftDays(m.due_date, 1)));
  if (m.repeat) lines.push('RRULE:FREQ=' + { daily: 'DAILY', weekly: 'WEEKLY', monthly: 'MONTHLY' }[m.repeat]);
  const steps = (m.steps || []).map(st => (st.done ? '[x] ' : '[ ] ') + st.text).join('\n');
  lines.push('SUMMARY:' + esc((M_AREAS[m.area]?.[0] || '') + ' ' + m.title),
    'DESCRIPTION:' + esc([m.notes, steps].filter(Boolean).join('\n\n')),
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc(m.title), 'TRIGGER:' + (tm ? '-PT1H' : '-PT15H'), 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadIcs(m) {
  if (!m.due_date) return toast('Give it a date first', 'error');
  const blob = new Blob([icsFor(m)], { type: 'text/calendar' });
  const a = h('a', { href: URL.createObjectURL(blob), download: (m.title || 'mission').replace(/[^\p{L}\d]+/gu, '-').slice(0, 40) + '.ics' });

}

/* ══════════════════════════ TRIPS ══════════════════════════ */
/* A trip has a name, dates and an optional budget. Expenses in the Trip category belong to one.
   Bookings made before you leave count as "before the trip". Saved in the Supabase "trips"
   table; until that exists, trips are kept in this browser and linked by date. */
const TRIP_SUBS = ['Hotel / Hostel', 'Transport', 'Restaurant', 'Food Order', 'Market', 'Coffee & Snacks', 'Cigarettes', 'Shopping', 'Gifts & Souvenirs',
  'Tickets & Tours', 'Entertainment', 'Health', 'SIM & Internet', 'Visa & Insurance', 'Other'];
const TRIP_TRANSPORT = ['Taxi', 'Bus', 'Metro', 'Train', 'Airplane', 'Ferry', 'Car Rental'];
const TRIP_EMOJIS = ['✈️', '🏖️', '🏔️', '🏙️', '🕌', '🏰', '🚗', '🎒', '🎄', '⚽'];
const TRIP_CURS = ['GBP', 'AZN', 'USD', 'TRY'];
const TRIPS_SQL = `-- Ledger: trips. Run this once in Supabase, SQL Editor, New query.
create table if not exists public.trips (
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null default auth.uid() references auth.users (id) on delete cascade,
  name text not null,
  emoji text,
  start_date date not null,
  end_date date not null,
  budget numeric,
  currency text not null default 'GBP',
  notes text,
  created_at timestamptz not null default now()
);
alter table public.trips enable row level security;
drop policy if exists "trips are yours" on public.trips;
create policy "trips are yours" on public.trips
  for all using (auth.uid() = user_id) with check (auth.uid() = user_id);
-- lets each expense say which trip it belongs to
alter table public.entries add column if not exists trip_id uuid references public.trips (id) on delete set null;`;

let tripStore = 'db', tripErr = null;
const tripMissing = e => ['PGRST205', '42P01', 'PGRST106'].includes(e?.code) || /trips/i.test(e?.message || '') && /(could not find|does not exist|schema cache)/i.test(e?.message || '');
const localTrips = () => load('ledger.trips', []);
async function loadTrips() {
  let res;
  try { res = await db.from('trips').select('*').order('start_date'); }
  catch (e) { res = { error: { message: e?.message || 'network error' } }; }
  if (res.error) {
    if (tripMissing(res.error)) { tripStore = 'local'; tripErr = null; cache.trips = localTrips(); }
    else { tripErr = res.error.message; if (tripStore === 'local') cache.trips = localTrips(); }
    return;
  }
  tripStore = 'db'; tripErr = null;
  cache.trips = res.data || [];
}
async function saveTrip(row, existing) {
  if (tripStore === 'local') {
    if (existing) Object.assign(cache.trips.find(t => t.id === existing.id), row);
    else cache.trips.push({ ...row, id: uid(), created_at: new Date().toISOString() });
    save('ledger.trips', cache.trips); return true;
  }
  const res = existing ? await db.from('trips').update(row).eq('id', existing.id) : await db.from('trips').insert([{ ...row, id: uid(), user_id: user.id }]);
  if (res.error) { toast('Could not save the trip: ' + res.error.message, 'error'); return false; }
  await loadTrips(); return true;
}
async function deleteTrip(t) {
  const n = tripRows(t).length;
  if (!confirm('Delete the trip "' + t.name + '"?' + (n ? ' Its ' + n + (n === 1 ? ' expense stays' : ' expenses stay') + ' in your ledger as Trip spending.' : ''))) return;
  if (tripStore === 'local') { cache.trips = cache.trips.filter(x => x.id !== t.id); save('ledger.trips', cache.trips); }
  else {
    const { error } = await db.from('trips').delete().eq('id', t.id);
    if (error) return toast('Could not delete: ' + error.message, 'error');
    cache.trips = cache.trips.filter(x => x.id !== t.id);
    cache.entries.forEach(e => { if (e.trip_id === t.id) e.trip_id = null; });
  }
  ui.tripId = null; toast('Trip deleted'); renderAll();
}
async function moveLocalTripsUp(btn) {
  const rows = localTrips(); if (!rows.length) return;
  btn.disabled = true; btn.textContent = 'Moving…';
  const { error } = await db.from('trips').insert(rows.map(({ id, name, emoji, start_date, end_date, budget, currency, notes }) => ({ id, name, emoji, start_date, end_date, budget, currency, notes, user_id: user.id })));
  if (error) { btn.disabled = false; btn.textContent = 'Try again'; return toast('Could not move them: ' + error.message, 'error'); }
  save('ledger.trips', []); toast('Moved ' + rows.length + (rows.length === 1 ? ' trip' : ' trips') + ' to your account');
  await loadTrips(); renderAll();
}

/* ── which trip an expense belongs to ── */
const tripById = id => cache.trips.find(t => t.id === id) || null;
function tripForDate(d) {
  const ts = [...cache.trips].sort((a, b) => a.start_date.localeCompare(b.start_date));
  return ts.find(t => d >= t.start_date && d <= t.end_date)                              // during it
    || ts.find(t => t.start_date > d && daysBetween(d, t.start_date) <= 180) || null;   // booked before it
}
function tripOf(e) {
  if (e.category !== 'Trip') return null;
  if (e.trip_id) return tripById(e.trip_id);
  return tripForDate(e.date);
}
const tripRows = t => cache.entries.filter(e => e.type === 'expense' && tripOf(e)?.id === t.id);
const tripDays = t => daysBetween(t.start_date, t.end_date) + 1;
function tripState(t, today = todayStr()) {
  if (today < t.start_date) return { k: 'soon', days: daysBetween(today, t.start_date) };
  if (today > t.end_date) return { k: 'past' };
  return { k: 'now', day: daysBetween(t.start_date, today) + 1, left: daysBetween(today, t.end_date) + 1 };
}
const activeTrip = () => cache.trips.find(t => tripState(t).k === 'now') || null;
const nextTrip = () => [...cache.trips].filter(t => tripState(t).k === 'soon').sort((a, b) => a.start_date.localeCompare(b.start_date))[0] || null;
function tripStateText(t) {
  const s = tripState(t);
  if (s.k === 'now') return 'Day ' + s.day + ' of ' + tripDays(t);
  if (s.k === 'soon') return s.days === 1 ? 'Starts tomorrow' : 'In ' + s.days + ' days';
  return 'Finished';
}
const tripDates = t => {
  const a = dateOf(t.start_date), b = dateOf(t.end_date), y = a.getFullYear() === b.getFullYear();
  return a.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', ...(y ? {} : { year: 'numeric' }) }) + ' to ' + b.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
};
/* a trip's group: Taxi belongs to Transport */
const tripGroup = sub => TRIP_TRANSPORT.includes(sub) ? 'Transport' : (sub || 'Other');
function tripLabel(e) {
  const t = tripOf(e), g = tripGroup(e.subcategory);
  const kind = e.subcategory && g !== e.subcategory ? g + ', ' + e.subcategory : (e.subcategory || 'Trip');
  return (t ? (t.emoji || '🧳') + ' ' + t.name + ', ' : 'Trip, ') + kind;
}
/* total in one currency, or by currency when it cannot be converted */
function tripMoney(rows, b) {
  const ok = c => Number.isFinite(conv(1, c, b));
  let total = 0; const left = {};
  rows.forEach(e => { const c = e.currency || 'GBP'; if (ratesReady() && ok(c)) total += conv(e.amount, c, b); else left[c] = (left[c] || 0) + num(e.amount); });
  return { total, left };
}
const leftText = left => Object.entries(left).map(([c, v]) => money(v, c)).join(' + ');
function tripSums(t) {
  const b = ratesReady() ? base() : (t.currency || 'GBP');
  const rows = tripRows(t);
  const before = rows.filter(e => e.date < t.start_date), during = rows.filter(e => e.date >= t.start_date);
  const all = tripMoney(rows, b), pre = tripMoney(before, b), dur = tripMoney(during, b);
  const budget = num(t.budget) > 0 ? conv(t.budget, t.currency || 'GBP', b) : null;
  return { b, rows, before, during, total: all.total, left: all.left, pre: pre.total, dur: dur.total, budget: Number.isFinite(budget) ? budget : null };
}

/* ── the card on the Expenses page ── */
function tripBanner() {
  const t = activeTrip() || nextTrip();
  if (!t) return null;
  const s = tripState(t), sum = tripSums(t);
  if (s.k === 'soon' && s.days > 60 && !sum.rows.length) return null;
  const pct = sum.budget ? Math.min(100, sum.total / sum.budget * 100) : null;
  let line;
  if (s.k === 'now') {
    const perDay = sum.dur / s.day;
    line = money(sum.total, sum.b) + ' spent' + (sum.dur ? ', ' + money(perDay, sum.b) + ' a day' : '');
    if (sum.budget) {
      const rest = sum.budget - sum.total;
      line += rest >= 0 ? '. You can spend ' + money(rest / s.left, sum.b) + ' a day for the rest' : '. ' + money(-rest, sum.b) + ' over budget';
    }
  } else line = sum.total ? money(sum.total, sum.b) + ' spent so far on bookings' : 'Nothing booked yet';
  return h('div', { class: 'trip-banner' + (s.k === 'now' ? ' live' : '') },
    h('button', { class: 'trip-banner-main', onclick: () => openTrip(t.id) },

/* Builds a PDF of your investments and gold right here in the browser and downloads it.
   Nothing is sent anywhere. The PDF library and the Manrope font load from jsDelivr
   the first time, then the app keeps a copy. */
const PDF_LIBS = [
  'https://cdn.jsdelivr.net/npm/jspdf@3.0.4/dist/jspdf.umd.min.js',
  'https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.2/dist/jspdf.plugin.autotable.min.js',
];
const PDF_FONTS = {
  normal: 'https://cdn.jsdelivr.net/npm/@expo-google-fonts/manrope@0.4.3/400Regular/Manrope_400Regular.ttf',
  bold: 'https://cdn.jsdelivr.net/npm/@expo-google-fonts/manrope@0.4.3/700Bold/Manrope_700Bold.ttf',
};
let pdfReady = null;
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector('script[data-src="' + src + '"]')) return res();
    const s = document.createElement('script');
    s.src = src; s.async = false; s.dataset.src = src; s.crossOrigin = 'anonymous';
    s.onload = () => res(); s.onerror = () => { s.remove(); rej(new Error('Could not load ' + src.split('/npm/')[1])); };
    document.head.appendChild(s);
  });
}
async function fontB64(url) {
  const buf = await (await fetch(url)).arrayBuffer();
  let bin = ''; const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function loadPdfLibs() {
  if (!pdfReady) {
    pdfReady = (async () => {
      for (const src of PDF_LIBS) await loadScript(src);
      let fonts = null;
      try { fonts = { normal: await fontB64(PDF_FONTS.normal), bold: await fontB64(PDF_FONTS.bold) }; }
      catch (e) { console.warn('Report font did not load', e); fonts = null; }   // the built in font still works, it just lacks ə, ş, ğ
      return { jsPDF: window.jspdf.jsPDF, fonts };
    })();
    pdfReady.catch(() => { pdfReady = null; });
  }
  return pdfReady;
}

  const stamp = new Date().toLocaleDateString('en-CA');
  const name = 'Ledger report ' + stamp + '.pdf';
  /* on a computer you choose where it goes, starting on the Desktop. The save window has to open first, while your click still counts. */
  let handle = null;
  if (window.showSaveFilePicker && finePointer()) {
    try {
      handle = await window.showSaveFilePicker({ suggestedName: name, startIn: 'desktop', types: [{ description: 'PDF document', accept: { 'application/pdf': ['.pdf'] } }] });
    } catch (e) {
      if (e?.name === 'AbortError') return;    // you closed the save window
      handle = null;                            // not allowed here, fall back to a normal download
    }
  }
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Building your PDF…';
  try {
    const { jsPDF, fonts } = await loadPdfLibs();
    const blob = buildReport(jsPDF, fonts, opt);
    if (handle) { const w = await handle.createWritable(); await w.write(blob); await w.close(); }
    else saveBlob(blob, name);
    if (opt.csv && cache.trades.length) saveBlob(new Blob(['﻿' + tradesCsv()], { type: 'text/csv;charset=utf-8' }), 'Ledger trades ' + stamp + '.csv');
    closeSheet();
    toast(handle ? 'Saved ' + handle.name : 'PDF downloaded' + (opt.csv ? ' with the CSV' : '') + '. Check your Downloads folder');
  } catch (e) {
    console.error(e);
    btn.disabled = false; btn.textContent = label;
    toast('Could not make the PDF: ' + (e?.message || 'unknown error') + '. Check your internet and try again', 'error');
  }
}
function saveBlob(blob, filename) {

}
