<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#f2f5fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<script>
  try { var t = localStorage.getItem('ledger.theme'); if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t)); } catch (e) {}
</script>
<style>
/* ───────────────────────── tokens ───────────────────────── */
:root {
  color-scheme: light;
  --font-ui: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Bricolage Grotesque', 'Manrope', system-ui, sans-serif;

  --page: #f2f5fa;
  --surface: #ffffff;
  --surface-2: #f6f8fc;
  --surface-3: #ebeff6;
  --line: #e3e8f1;
  --line-2: #cfd6e4;
  --ink: #141a2e;
  --ink-2: #4a5272;
  --muted: #6b7392;

  --accent: #0284c7;
  --accent-ink: #0369a1;
  --accent-soft: #e1f2fc;
  --on-accent: #ffffff;

  --green: #0b7a43;   --green-soft: #e1f5e9;
  --red: #d6343a;     --red-soft: #fdeceb;
  --gold: #9a6b00;    --gold-soft: #fbf1d4;

  --bar-muted: #cdd6e5;
  --grid: #e9edf4;
  --axis: #cfd6e4;

  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;

  --shadow-float: 0 18px 50px rgba(20,26,46,.16), 0 3px 10px rgba(20,26,46,.07);
  --shadow-soft: 0 1px 2px rgba(20,26,46,.06);
  --backdrop: rgba(12,16,30,.42);

  --r-xl: 26px; --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --tabbar-h: 66px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0c1122; --surface: #161c30; --surface-2: #1b2239; --surface-3: #222a45;
    --line: #262e4a; --line-2: #343d5f;
    --ink: #eef1f8; --ink-2: #b4bbd3; --muted: #8891b0;
    --accent: #38bdf8; --accent-ink: #7dd3fc; --accent-soft: rgba(56,189,248,.14); --on-accent: #06243a;
    --green: #3ddc91; --green-soft: rgba(61,220,145,.13);
    --red: #ff6b6e; --red-soft: rgba(255,107,110,.13);
    --gold: #f5c451; --gold-soft: rgba(245,196,81,.13);
    --bar-muted: #34405f; --grid: #222a43; --axis: #343d5f;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --shadow-float: 0 18px 50px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.3);
    --shadow-soft: 0 1px 2px rgba(0,0,0,.3);
    --backdrop: rgba(3,6,16,.62);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0c1122; --surface: #161c30; --surface-2: #1b2239; --surface-3: #222a45;
  --line: #262e4a; --line-2: #343d5f;
  --ink: #eef1f8; --ink-2: #b4bbd3; --muted: #8891b0;
  --accent: #38bdf8; --accent-ink: #7dd3fc; --accent-soft: rgba(56,189,248,.14); --on-accent: #06243a;
  --green: #3ddc91; --green-soft: rgba(61,220,145,.13);
  --red: #ff6b6e; --red-soft: rgba(255,107,110,.13);
  --gold: #f5c451; --gold-soft: rgba(245,196,81,.13);
  --bar-muted: #34405f; --grid: #222a43; --axis: #343d5f;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
  --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --shadow-float: 0 18px 50px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.3);
  --shadow-soft: 0 1px 2px rgba(0,0,0,.3);
  --backdrop: rgba(3,6,16,.62);
}

/* ───────────────────────── base ───────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--page); color: var(--ink);
  font: 500 15px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  min-height: 100vh; transition: background-color .25s;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button, a, input, select, textarea, label, .cat, .pill, .tab, .heat-cell, .stack-seg { touch-action: manipulation; }
input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; min-width: 0; display: block; }
input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value { text-align: left; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.emo { font-family: 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; line-height: 1; }

/* ───────────────────────── login ───────────────────────── */
body.booting #loginScreen { visibility: hidden; }
#loginScreen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login { width: 100%; max-width: 400px; }
.login-mark { font-family: var(--font-display); font-weight: 800; font-size: 46px; letter-spacing: -.04em; line-height: 1; }
.login-emoji { font-size: 26px; margin: 14px 0 6px; letter-spacing: 6px; }
.login-line { color: var(--ink-2); font-size: 16px; margin-bottom: 28px; }
.login-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 24px; box-shadow: var(--shadow-soft); }
.login-err { color: var(--red); font-size: 14px; font-weight: 600; margin-top: 12px; }

/* ───────────────────────── shell ───────────────────────── */
#app { display: none; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
  background: var(--page);
  background: color-mix(in srgb, var(--page) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.wordmark { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -.035em; }
.top-actions { display: flex; gap: 8px; }
.round-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; font-size: 17px; font-weight: 800;
  transition: transform .15s var(--ease), background-color .2s;
}
.round-btn:active { transform: scale(.94); }
.avatar { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -8px 28px rgba(20,26,46,.06);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  height: var(--tabbar-h); background: none; border: 0;
  font-size: 11.5px; font-weight: 700; color: var(--muted);
}
.tab .emo { font-size: 23px; transition: transform .3s var(--ease), filter .2s; filter: grayscale(.85); opacity: .7; }
.tab.active { color: var(--accent-ink); }
.tab.active .emo { transform: translateY(-2px) scale(1.14); filter: none; opacity: 1; }

.rail { display: none; }
main { max-width: 1120px; margin: 0 auto; min-width: 0; overflow-x: clip; padding: 6px 16px calc(var(--tabbar-h) + 104px + env(safe-area-inset-bottom)); }

@media (min-width: 960px) {
  .topbar, .tabbar { display: none; }
  .rail {
    display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; width: 240px;
    padding: 28px 16px 20px; background: var(--surface); border-right: 1px solid var(--line); z-index: 20;
  }
  .rail .wordmark { font-size: 30px; padding: 0 12px; margin-bottom: 28px; }
  .rail-nav { display: flex; flex-direction: column; gap: 4px; }
  .rail-link {
    display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px;
    background: none; border: 0; font-weight: 700; font-size: 15px; color: var(--ink-2); text-align: left;
    transition: background-color .15s, color .15s;
  }
  .rail-link .emo { font-size: 20px; width: 24px; text-align: center; filter: grayscale(.6); transition: filter .2s, transform .25s var(--ease); }
  .rail-link:hover { background: var(--surface-2); color: var(--ink); }
  .rail-link.active { background: var(--accent-soft); color: var(--accent-ink); }
  .rail-link.active .emo { filter: none; transform: scale(1.1); }
  .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 4px; }
  .rail-user { font-size: 13px; color: var(--muted); padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail-row { display: flex; gap: 8px; }
  main { margin-left: 240px; max-width: none; padding: 34px 44px 72px; }
  .view { max-width: 1100px; }
}

/* ───────────────────────── views ───────────────────────── */
.view-enter { animation: fadeIn .28s ease both; }
.view-enter > :not(.page-head) { animation: viewIn .36s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes fadeIn { from { opacity: 0; } }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 8px 0 14px; }
.page-title { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -.03em; line-height: 1.1; display: flex; align-items: center; gap: 10px; }
.page-title .emo { font-size: 27px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 46px; padding: 0 20px; border-radius: 999px; border: 0;
  font-weight: 800; font-size: 15px; white-space: nowrap;
  transition: transform .15s var(--ease), background-color .2s, box-shadow .2s, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn-soft { background: var(--accent-soft); color: var(--accent-ink); }
.btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-gold { background: var(--gold-soft); color: var(--gold); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn.block { width: 100%; height: 54px; font-size: 16px; }
.btn .plus { font-size: 20px; line-height: 1; margin-top: -2px; }

.page-action { box-shadow: var(--shadow-soft); }
@media (max-width: 959px) {
  .page-action {
    position: fixed; z-index: 25; right: 16px;
    bottom: calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom));
    height: 54px; padding: 0 22px; box-shadow: var(--shadow-float);
  }
}

/* hero */
.hero { margin: 4px 0 22px; }
.hero-label { font-size: 15px; font-weight: 700; color: var(--ink-2); }
.hero-nums { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; margin-top: 2px; }
.hero-num {
  font-family: var(--font-display); font-weight: 700; letter-spacing: -.04em; line-height: 1.04;
  font-size: clamp(42px, 12vw, 64px);
}
.hero-nums.two .hero-num { font-size: clamp(34px, 9.5vw, 52px); }
.hero-num.zero { color: var(--muted); }
.hero-sub { margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14.5px; font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; white-space: nowrap; }
.chip.good { background: var(--green-soft); color: var(--green); }
.chip.bad { background: var(--red-soft); color: var(--red); }
.chip.neutral { background: var(--surface-3); color: var(--ink-2); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }

/* joined stat strip */
.stats {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 26px;
}
.stat { background: var(--surface); padding: 14px 16px; min-width: 0; }
.stat-label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.stat-value { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin-top: 2px; overflow-wrap: anywhere; }
.stat-note { font-size: 12.5px; color: var(--muted); margin-top: 1px; font-weight: 600; }
@media (max-width: 759px) { .stats > .stat:last-child:nth-child(odd) { grid-column: 1 / -1; } }
@media (min-width: 760px) { .stats.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } .stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* sections */
.section { margin: 30px 0; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.section-title { font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -.02em; line-height: 1.2; }
.section-note { font-size: 14px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; }
.panel + .panel { margin-top: 14px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.grid-2 > * { min-width: 0; }
@media (min-width: 1080px) { .grid-2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); align-items: start; } .grid-2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.stack-tight > * + * { margin-top: 10px; }

/* lists */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.row {
  display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 32px; align-items: center; gap: 12px;
  padding: 12px 10px 12px 14px; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row.no-del { grid-template-columns: 44px minmax(0, 1fr) auto; padding-right: 14px; }
.row-new { animation: rowNew 1.6s var(--ease); }
@keyframes rowNew { 0% { background: var(--accent-soft); transform: translateY(-6px); opacity: 0; } 25% { opacity: 1; transform: none; } 100% { background: transparent; } }
.bubble { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-3); display: grid; place-items: center; font-size: 22px; }
.bubble.gold { background: var(--gold-soft); }
.bubble.in { background: var(--green-soft); }
.row-main { min-width: 0; }
.row-title { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: 13px; color: var(--muted); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub.wrap { white-space: normal; line-height: 1.4; }
.chart-key { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 8px; }
.chart-key i { width: 18px; height: 2px; background: var(--ink-2); border-radius: 2px; }
.amt { font-weight: 800; font-size: 15.5px; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.amt.in { color: var(--green); }
.pos { color: var(--green); } .neg { color: var(--red); }
.amt-sub { font-size: 12.5px; color: var(--muted); font-weight: 600; text-align: right; white-space: nowrap; }
.icon-btn {
  width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--muted);
  display: grid; place-items: center; font-size: 15px; transition: background-color .15s, color .15s;
}
.icon-btn:hover, .icon-btn:focus-visible { background: var(--red-soft); color: var(--red); }
.group-head {
  display: flex; justify-content: space-between; gap: 10px; padding: 10px 14px 8px;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
  font-size: 13.5px; font-weight: 800; color: var(--ink-2);
}
.group-head .gtot { color: var(--muted); font-weight: 700; }

.empty { text-align: center; padding: 34px 18px; color: var(--ink-2); font-weight: 600; }
.empty .emo { font-size: 34px; display: block; margin-bottom: 10px; }
.empty .btn { margin-top: 14px; }

/* date bar */
.datebar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.nav-btn { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 20px; font-weight: 800; display: grid; place-items: center; color: var(--ink-2); }
.nav-btn:active { transform: scale(.94); }
.date-pill {
  position: relative; display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; cursor: pointer;
}
.date-pill input { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

/* forms */
.field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; min-width: 0; }
.field > label, .field-label { font-size: 14px; font-weight: 800; color: var(--ink-2); }
.field-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.field-row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.input, .select, .textarea {
  width: 100%; height: 50px; border-radius: 13px; border: 1.5px solid var(--line-2);
  background: var(--surface); color: var(--ink); font: 600 16px var(--font-ui); padding: 0 14px;
  transition: border-color .15s, box-shadow .15s;
}
.textarea { height: auto; min-height: 84px; padding: 12px 14px; resize: vertical; line-height: 1.45; }
.select { appearance: none; -webkit-appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 22px, calc(100% - 14px) 22px; background-size: 6px 6px; background-repeat: no-repeat; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.input.shake { animation: shake .4s; border-color: var(--red); }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.hint { font-size: 13.5px; color: var(--muted); font-weight: 600; line-height: 1.55; }
.hint.box { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }

.amount-wrap { display: flex; align-items: center; gap: 12px; padding: 4px 0 8px; border-bottom: 2px solid var(--line); margin-bottom: 18px; transition: border-color .2s; }
.amount-wrap:focus-within { border-color: var(--accent); }
.amount-input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-family: var(--font-display); font-weight: 700; font-size: 44px; letter-spacing: -.03em; height: 64px; color: var(--ink); }
.amount-input::placeholder { color: var(--line-2); }

.seg { display: inline-flex; background: var(--surface-3); border-radius: 13px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; padding: 0 14px; height: 38px; border-radius: 10px; font-weight: 800; font-size: 14px; color: var(--ink-2); transition: background-color .2s, color .2s, box-shadow .2s; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-soft); }
.seg.full { display: flex; } .seg.full button { flex: 1; }
.seg button.on.out { color: var(--red); } .seg button.on.in { color: var(--green); }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.cat {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  min-height: 78px; padding: 8px 4px; border-radius: 15px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: 12.5px; line-height: 1.2; color: var(--ink-2); text-align: center;
  transition: border-color .15s, background-color .15s, transform .15s var(--ease);
}
.cat .emo { font-size: 25px; }
.cat:active { transform: scale(.95); }
.cat.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }

  if (res.error) { settingsErr = res.error.message || 'unknown error'; console.warn('[settings] read failed:', res.error); return; }
  settingsErr = null;

    if (data) {
      if (Number(data.gbp_azn) > 0 && Number(data.usd_azn) > 0) rates = { gbpAzn: Number(data.gbp_azn), usdAzn: Number(data.usd_azn), base: data.base_currency || base() };

  pushTimer = setTimeout(async () => {
    const loud = pushByUser; pushByUser = false;
    let error = null;
    try { ({ error } = await db.from('user_settings').upsert({
      user_id: user.id,
      gbp_azn: Number(rates.gbpAzn) > 0 ? Number(rates.gbpAzn) : null,
      usd_azn: Number(rates.usdAzn) > 0 ? Number(rates.usdAzn) : null,
      base_currency: base(),
      gold_price: Number(goldSpot.price) > 0 ? Number(goldSpot.price) : null,
      gold_currency: Number(goldSpot.price) > 0 ? goldSpot.cur : null,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'user_id' })); }
    catch (e) { error = { message: e?.message || 'network error' }; }

}

    }));

    const ring = s('circle', { r: 6, style: { fill: 'var(--accent)', stroke: 'var(--surface)', strokeWidth: 2.5, opacity: 0, pointerEvents: 'none' } });

    const nearest = cx => { let bi = 0, bd = Infinity; xy.forEach((p, i) => { const d = Math.abs(p[0] - cx); if (d < bd) { bd = d; bi = i; } }); return bi; };

    const showAt = (i, ev) => {

    hit.addEventListener('pointermove', move);
    hit.addEventListener('pointerdown', e => { e.stopPropagation(); move(e); });
    hit.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { cross.style.opacity = 0; ring.style.opacity = 0; hideTip(); } });
    hit.setAttribute('tabindex', '0');
    hit.addEventListener('focus', () => showAt(focusIdx));
    hit.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); showAt(Math.max(0, focusIdx - 1)); }
      if (e.key === 'ArrowRight') { e.preventDefault(); showAt(Math.min(points.length - 1, focusIdx + 1)); }

    hit.addEventListener('blur', () => { cross.style.opacity = 0; ring.style.opacity = 0; hideTip(); });
    svg.appendChild(hit);

  }, height, label);
}

/* calendar heat map */
function heatCalendar(from, to, effTo, byDate, cur) {

    else if (d > effTo) grid.appendChild(h('div', { class: 'heat-cell future', 'aria-hidden': 'true' }, h('span', { class: 'd' }, String(Number(d.slice(8))))));

function countUp(el) {

/* ══════════════════════════ calculations ══════════════════════════ */
function sumByCur(rows, type) {
  const o = { GBP: 0, AZN: 0 };
  rows.forEach(r => { if (r.type !== type) return; const c = r.currency || 'GBP'; o[c] = (o[c] || 0) + num(r.amount); });
  return o;
}
function tradeMath(t) {
  const cost = num(t.quantity) * num(t.price_per_share), comm = num(t.commission);
  const total = t.side === 'Sell' ? comm - cost : cost + comm;
  return { cost, comm, total, azn: t.fx_rate ? total * num(t.fx_rate) : null };
}
function tickerOrder() {
  const seen = [];
  [...cache.trades].sort((a, b) => (a.trade_date + (a.created_at || '')).localeCompare(b.trade_date + (b.created_at || '')))
    .forEach(t => { if (!seen.includes(t.ticker)) seen.push(t.ticker); });
  return seen;
}
function tickerColor(ticker) { const i = tickerOrder().indexOf(ticker); return i >= 0 && i < SERIES.length ? SERIES[i] : 'var(--muted)'; }
function buildHoldings() {
  const map = new Map();
  cache.trades.forEach(t => {
    const m = tradeMath(t);
    const hd = map.get(t.ticker) || { ticker: t.ticker, shares: 0, netUsd: 0, azn: 0 };
    hd.shares += (t.side === 'Sell' ? -1 : 1) * num(t.quantity);
    hd.netUsd += m.total; hd.azn += m.azn || 0;
    map.set(t.ticker, hd);
  });
  const all = [...map.values()];
  const open = all.filter(x => Math.abs(x.shares) > 1e-5), closed = all.filter(x => Math.abs(x.shares) <= 1e-5);
  open.forEach(x => {
    x.price = cache.prices[x.ticker] ?? null;
    x.value = x.price !== null ? x.shares * x.price : null;
    x.gain = x.value !== null ? x.value - x.netUsd : null;
    x.avg = x.shares ? x.netUsd / x.shares : 0;
  });
  const order = tickerOrder();
  open.sort((a, b) => order.indexOf(a.ticker) - order.indexOf(b.ticker));
  return { open, closed };
}
function portfolioUsd() { return buildHoldings().open.filter(x => x.value !== null).reduce((a, x) => a + x.value, 0); }
const fineness = k => KARAT_FINENESS[Number(k)] ?? (Number(k) / 24);
const pureGrams = g => num(g.grams) * fineness(g.karat);
function goldValueTotal() { if (!goldSpot.price) return null; return cache.gold.reduce((a, i) => a + pureGrams(i), 0) * num(goldSpot.price); }
function cashIn(b) { return cache.accounts.reduce((a, x) => { const v = conv(x.balance, x.currency, b); return a + (Number.isFinite(v) ? v : 0); }, 0); }
function netWorthParts(b) {
  const inv = conv(portfolioUsd(), 'USD', b);
  const gv = goldValueTotal();
  const gold = gv === null ? 0 : conv(gv, goldSpot.cur, b);
  const cash = cashIn(b);
  const investments = Number.isFinite(inv) ? inv : 0, goldV = Number.isFinite(gold) ? gold : 0;
  return { investments, gold: goldV, cash, total: investments + goldV + cash };
}
function snapTotalIn(snap, b) {
  const r = { gbpAzn: num(snap.gbp_azn) || rates.gbpAzn, usdAzn: num(snap.usd_azn) || rates.usdAzn };
  const v = conv(snap.total, snap.base_currency, b, r);
  return Number.isFinite(v) ? v : null;
}

    ticker: input({ type: 'text', maxlength: 12, placeholder: 'VEU', autocapitalize: 'characters', style: { textTransform: 'uppercase' } }),
    qty: input({ type: 'text', inputmode: 'decimal', placeholder: '1' }), price: input({ type: 'text', inputmode: 'decimal', placeholder: '0.00' }),
    comm: input({ type: 'text', inputmode: 'decimal', placeholder: '1.00', value: '1.00' }), fx: input({ type: 'text', inputmode: 'decimal', value: rates.usdAzn ? String(rates.usdAzn) : '1.70' }),
    plat: input({ type: 'text', maxlength: 40, value: 'ABB' }), note: input({ type: 'text', maxlength: 200, placeholder: 'Why this purchase' }),
  };
  const preview = h('div', { class: 'hint box', hidden: true });
  const upd = () => {
    const m = tradeMath({ side, quantity: parseAmount(f.qty.value), price_per_share: parseAmount(f.price.value), commission: parseAmount(f.comm.value), fx_rate: parseAmount(f.fx.value) });
    if (!m.cost) { preview.hidden = true; return; }
    preview.hidden = false;
    preview.textContent = 'Shares cost ' + money(m.cost, 'USD') + ' plus a fee of ' + money(m.comm, 'USD') + '. ' +
      (side === 'Sell' ? 'You receive ' : 'You pay ') + money(Math.abs(m.total), 'USD') + (m.azn !== null ? ', which is ' + money(Math.abs(m.azn), 'AZN') + '.' : '.');
  };
  ['qty', 'price', 'comm', 'fx'].forEach(k => f[k].addEventListener('input', upd));
  const btn = h('button', { class: 'btn btn-primary block' }, 'Save trade');
  btn.addEventListener('click', async () => {
    const ticker = f.ticker.value.trim().toUpperCase(), q = parseAmount(f.qty.value), p = parseAmount(f.price.value);
    if (!ticker) return shake(f.ticker);
    if (!(q > 0)) return shake(f.qty);
    if (!(p > 0)) return shake(f.price);
    btn.disabled = true; btn.textContent = 'Saving…';
    const { error } = await db.from('trades').insert([{
      trade_date: f.date.value || t, trade_time: f.time.value || null, ticker, side, quantity: q, price_per_share: p,
      commission: parseAmount(f.comm.value), fx_rate: parseAmount(f.fx.value) || null,
      platform: f.plat.value.trim() || null, note: f.note.value.trim() || null, user_id: user.id,
    }]);
    btn.disabled = false; btn.textContent = 'Save trade';
    if (error) return toast('Could not save: ' + error.message, 'error');
    closeSheet(); toast('Trade saved'); refreshAll();
  });
  openSheet('Add a trade', h('div', null,
    h('div', { class: 'field' }, seg([['Buy', 'Buy', 'in'], ['Sell', 'Sell', 'out']], side, v => { side = v; upd(); }, { full: true })),
    h('div', { class: 'field-row' }, field('Fund', f.ticker), field('Quantity', f.qty)),
    h('div', { class: 'field-row' }, field('Price per share, $', f.price), field('Fee, $', f.comm)),
    h('div', { class: 'field-row' }, field('Date', f.date), field('Time', f.time)),
    h('div', { class: 'field-row' }, field('Manat per $1', f.fx), field('Platform', f.plat)),
    field('Note', f.note), preview), { onOpen: () => f.ticker.focus(), footer: btn });
}

function openGoldSheet() {
  let karat = 14, gift = false;
  const f = {
    date: input({ type: 'date', value: todayStr() }), name: input({ type: 'text', maxlength: 60, placeholder: 'Ring, çeyrek, bar' }),
    grams: input({ type: 'text', inputmode: 'decimal', placeholder: '0.00' }), ppg: input({ type: 'text', inputmode: 'decimal', placeholder: '0.00' }),
    paid: input({ type: 'text', inputmode: 'decimal', placeholder: '0.00' }), note: input({ type: 'text', maxlength: 200, placeholder: 'Where from, who gave it' }),
  };
  let cur = 'AZN';
  const preview = h('div', { class: 'hint box', hidden: true });
  const upd = () => {
    const g = parseAmount(f.grams.value);
    if (!g) { preview.hidden = true; return; }
    preview.hidden = false;
    const pure = g * fineness(karat);
    let txt = karat + 'K is ' + (fineness(karat) * 100).toFixed(1) + '% gold, so ' + grams(g) + ' holds ' + grams(pure) + ' of pure gold.';
    if (goldSpot.price) txt += ' At today’s price that is worth about ' + money(pure * num(goldSpot.price), goldSpot.cur) + '.';
    preview.textContent = txt;
  };
  f.grams.addEventListener('input', upd);
  const karatGrid = h('div', { class: 'pill-grid' });
  const paintK = () => { clear(karatGrid); KARATS.forEach(([k, p]) => karatGrid.appendChild(h('button', { type: 'button', class: 'pill' + (karat === k ? ' on' : ''), onclick: () => { karat = k; paintK(); upd(); } }, k + 'K', h('span', { style: { opacity: .7, fontWeight: 600 } }, p)))); };
  paintK();
  const paidField = field('Paid', f.paid);
  const btn = h('button', { class: 'btn btn-primary block' }, 'Save gold');
  btn.addEventListener('click', async () => {
    const name = f.name.value.trim(), g = parseAmount(f.grams.value);
    if (!name) return shake(f.name);
    if (!(g > 0)) return shake(f.grams);
    btn.disabled = true; btn.textContent = 'Saving…';
    const { error } = await db.from('gold_items').insert([{
      buy_date: f.date.value || todayStr(), item_name: name, grams: g, karat, price_per_gram: parseAmount(f.ppg.value),
      paid: gift ? 0 : parseAmount(f.paid.value), currency: cur, is_gift: gift, note: f.note.value.trim() || null, user_id: user.id,
    }]);
    btn.disabled = false; btn.textContent = 'Save gold';
    if (error) return toast('Could not save: ' + error.message, 'error');
    closeSheet(); toast('Gold saved'); refreshAll();
  });
  openSheet('Add gold', h('div', null,
    h('div', { class: 'field' }, seg([['bought', '🛍️ I bought it'], ['gift', '🎁 It was a gift']], 'bought', v => { gift = v === 'gift'; paidField.hidden = gift; }, { full: true })),
    h('div', { class: 'field-row' }, field('What is it', f.name), field('Weight in grams', f.grams)),
    h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Purity'), karatGrid),
    preview, h('div', { style: { height: '14px' } }),
    h('div', { class: 'field-row' }, field('Price per gram', f.ppg), paidField),
    h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Currency'), seg([['AZN', '₼'], ['TRY', '₺'], ['USD', '$'], ['GBP', '£']], cur, v => { cur = v; })),
    h('div', { class: 'field-row' }, field('Date', f.date), field('Note', f.note))), { onOpen: () => f.name.focus(), footer: btn });
}

function openAddAccountSheet() {
  let kind = 'bank', cur = 'AZN';
  const name = input({ type: 'text', maxlength: 60, placeholder: 'ABB card' });
  const bal = input({ type: 'text', inputmode: 'decimal', placeholder: '0.00' });
  const note = input({ type: 'text', maxlength: 120, placeholder: 'What it is for' });
  const kinds = h('div', { class: 'pill-grid' });
  const paint = () => { clear(kinds); Object.entries(ACCOUNT_KINDS).forEach(([k, [e, l]]) => kinds.appendChild(h('button', { type: 'button', class: 'pill' + (kind === k ? ' on' : ''), onclick: () => { kind = k; paint(); } }, h('span', { class: 'emo' }, e), l))); };
  paint();
  const btn = h('button', { class: 'btn btn-primary block' }, 'Add account');
  btn.addEventListener('click', async () => {
    if (!name.value.trim()) return shake(name);
    btn.disabled = true;
    const { error } = await db.from('accounts').insert([{ user_id: user.id, name: name.value.trim(), kind, balance: parseAmount(bal.value), currency: cur, note: note.value.trim() || null, sort_order: cache.accounts.length }]);
    btn.disabled = false;
    if (error) return toast('Could not save: ' + error.message, 'error');
    closeSheet(); toast('Account added'); refreshAll();
  });
  openSheet('Add an account', h('div', null,
    field('Name', name),
    h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Kind'), kinds),
    h('div', { class: 'field-row' }, field('Balance', bal), h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Currency'),
      h('div', { style: { overflowX: 'auto' } }, seg([['AZN', '₼'], ['GBP', '£'], ['USD', '$'], ['TRY', '₺'], ['EUR', '€']], cur, v => { cur = v; })))),
    field('Note', note)), { onOpen: () => name.focus(), footer: btn });
}

function openThesisSheet(existing) {
  let status = existing?.status || 'owned';
  const tk = input({ type: 'text', maxlength: 12, value: existing?.ticker || '', style: { textTransform: 'uppercase' } });
  const co = input({ type: 'text', maxlength: 80, value: existing?.company || '' });
  const dt = input({ type: 'date', value: existing?.next_earnings || '' });
  const why = h('textarea', { class: 'textarea', maxlength: 500, value: existing?.why || '' });
  const sell = h('textarea', { class: 'textarea', maxlength: 500, value: existing?.sell_trigger || '' });
  const btn = h('button', { class: 'btn btn-primary block' }, existing ? 'Save changes' : 'Save note');
  btn.addEventListener('click', async () => {
    const ticker = tk.value.trim().toUpperCase();
    if (!ticker) return shake(tk);
    const row = { user_id: user.id, ticker, company: co.value.trim() || null, status, why: why.value.trim() || null, sell_trigger: sell.value.trim() || null, next_earnings: dt.value || null };
    const match = existing || cache.thesis.find(x => x.ticker === ticker);
    btn.disabled = true;
    const { error } = match ? await db.from('thesis').update(row).eq('id', match.id) : await db.from('thesis').insert([row]);
    btn.disabled = false;
    if (error) return toast('Could not save: ' + error.message, 'error');
    closeSheet(); toast('Note saved'); refreshAll();
  });
  openSheet(existing ? 'Edit note' : 'Add a note', h('div', null,
    h('div', { class: 'field' }, seg([['owned', 'I own it'], ['watching', 'Watching']], status, v => { status = v; }, { full: true })),
    h('div', { class: 'field-row' }, field('Fund', tk), field('Company', co)),
    field('Why I own it', why), field('What would make me sell', sell), field('Next earnings date', dt)),
    { onOpen: () => (existing ? why : tk).focus(), footer: btn });
}

function openRatesSheet() {
  let b = base();
  const g = input({ type: 'text', inputmode: 'decimal', value: rates.gbpAzn ? String(rates.gbpAzn) : '', placeholder: '2.25' });
  const u = input({ type: 'text', inputmode: 'decimal', value: rates.usdAzn ? String(rates.usdAzn) : '', placeholder: '1.70' });
  const btn = h('button', { class: 'btn btn-primary block' }, 'Save rates');
  btn.addEventListener('click', () => {
    const gv = parseAmount(g.value), uv = parseAmount(u.value);
    if (!(gv > 0)) return shake(g);
    if (!(uv > 0)) return shake(u);
    rates = { gbpAzn: gv, usdAzn: uv, base: b }; save('ledger.rates', rates); pushSettings();
    closeSheet(); toast('Rates saved. Showing everything in ' + CUR_NAME[b].toLowerCase()); renderAll();
  });
  openSheet('Exchange rates', h('div', null,
    h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Show totals in'), seg([['AZN', '₼ Manat'], ['GBP', '£ Pounds'], ['USD', '$ Dollars']], b, v => { b = v; }, { full: true })),
    h('div', { class: 'field-row' }, field('£1 in manat', g), field('$1 in manat', u)),
    h('div', { class: 'hint box' }, 'These two rates cover all three currencies. Every page uses them, on your phone and your laptop alike.'),
    syncNote()),
    { onOpen: () => g.focus(), footer: btn });
}

function openAccountSheet() {
  openSheet('Your account', h('div', null,
    h('div', { class: 'hint box', style: { marginBottom: '16px' } }, 'Signed in as ' + (user?.email || '')),
    h('div', { class: 'field' }, h('button', { class: 'btn btn-ghost block', onclick: e => { toggleTheme(); e.currentTarget.textContent = currentTheme() === 'dark' ? '☀️ Switch to light' : '🌙 Switch to dark'; } }, currentTheme() === 'dark' ? '☀️ Switch to light' : '🌙 Switch to dark')),
    h('button', { class: 'btn btn-ghost block', style: { color: 'var(--red)' }, onclick: () => { closeSheet(); db.auth.signOut(); } }, 'Sign out')));
}

/* ══════════════════════════ ACTIONS ══════════════════════════ */
async function removeRow(table, id, label) {
  if (!confirm('Delete ' + label + '? This cannot be undone.')) return;
  const { error } = await db.from(table).delete().eq('id', id);
  if (error) return toast('Could not delete: ' + error.message, 'error');
  toast('Deleted'); refreshAll();
}
async function savePrice(ticker, price) {
  if (!user || !(price > 0)) return;
  const { error } = await db.from('prices').upsert({ user_id: user.id, ticker, price, updated_at: new Date().toISOString() }, { onConflict: 'user_id,ticker' });
  if (error) return toast('Could not save the price', 'error');
  cache.prices[ticker] = price; cache.priceStamp = new Date().toISOString();
  toast(ticker + ' price saved');
  renderInvest(); renderNetWorth(); renderAnalysis();
}
async function refreshPrices(ev) {
  if (!user) return;
  const btn = ev?.currentTarget;
  const tickers = [...new Set(buildHoldings().open.map(x => x.ticker))];
  if (!tickers.length) return toast('No open positions to price', 'error');
  if (btn) { btn.disabled = true; btn.textContent = 'Fetching…'; }
  try {
    const { data, error } = await db.functions.invoke('quotes', { body: { tickers } });
    if (error) throw error;
    const got = data && data.prices ? data.prices : {};
    const names = Object.keys(got);
    if (!names.length) throw new Error('nothing came back');
    const now = new Date().toISOString();
    const { error: e2 } = await db.from('prices').upsert(names.map(t => ({ user_id: user.id, ticker: t, price: Number(got[t]), updated_at: now })), { onConflict: 'user_id,ticker' });
    if (e2) throw e2;
    names.forEach(t => { cache.prices[t] = Number(got[t]); });
    cache.priceStamp = now;
    const failed = data.failed || [];
    toast('Updated ' + names.length + (names.length === 1 ? ' price' : ' prices') + (failed.length ? '. ' + failed.join(', ') + ' failed' : ''));
    renderInvest(); renderNetWorth(); renderAnalysis();
  } catch (err) {
    toast('Could not fetch prices (' + (err.message || err) + '). Type them in by hand.', 'error');
    if (btn) { btn.disabled = false; btn.textContent = '↻ Refresh prices'; }
  }
}
async function fetchGoldPrice(want, btn) {
  if (!user) return;
  btn.disabled = true; btn.textContent = 'Fetching…';
  try {
    const { data, error } = await db.functions.invoke('quotes', { body: { tickers: ['GC=F', 'AZN=X'] } });
    if (error) throw error;
    const oz = data?.prices?.['GC=F'], aznPerUsd = data?.prices?.['AZN=X'];
    if (!oz) throw new Error('no gold price came back');
    const usdG = oz / GRAMS_PER_TROY_OZ;
    let value, cur, how;
    if (want === 'AZN' && aznPerUsd) { value = usdG * aznPerUsd; cur = 'AZN'; how = money(usdG, 'USD') + ' a gram at ' + num(aznPerUsd).toFixed(4) + ' manat to the dollar'; }
    else { value = usdG; cur = 'USD'; how = money(usdG, 'USD') + ' a gram' + (want !== 'USD' ? '. Only dollars and manat can be fetched, so this is in dollars' : ''); }
    goldSpot = { price: Number(value.toFixed(2)), cur }; save('ledger.goldSpot', goldSpot); pushSettings();
    ui.goldStamp = 'Gold is ' + money(oz, 'USD') + ' an ounce, so ' + how + '. Fetched ' + new Date().toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '. This is the market price; a shop pays a little less.';
    toast('Gold price updated');
    renderGold(); renderNetWorth(); renderAnalysis();
  } catch (err) {
    toast('Could not fetch gold (' + (err.message || err) + '). Type it in instead.', 'error');
    btn.disabled = false; btn.textContent = '↻ Fetch live';
  }
}
async function saveBalance(id, balance) {
  const now = new Date().toISOString();
  const { error } = await db.from('accounts').update({ balance, updated_at: now }).eq('id', id);
  if (error) return toast('Could not save the balance', 'error');
  const a = cache.accounts.find(x => x.id === id);
  if (a) { a.balance = balance; a.updated_at = now; }
  toast('Balance updated');
  renderNetWorth();
}
async function saveSnapshot(date, note, btn) {
  if (!user || !ratesReady()) return toast('Set the exchange rates first', 'error');
  const b = base(), p = netWorthParts(b);
  btn.disabled = true;
  const { error } = await db.from('networth_snapshots').upsert({
    user_id: user.id, snap_date: date || todayStr(), base_currency: b,
    investments: Number(p.investments.toFixed(2)), gold: Number(p.gold.toFixed(2)), cash: Number(p.cash.toFixed(2)), total: Number(p.total.toFixed(2)),
    gbp_azn: rates.gbpAzn, usd_azn: rates.usdAzn, note: (note || '').trim() || null,
  }, { onConflict: 'user_id,snap_date' });
  btn.disabled = false;
  if (error) return toast('Could not save: ' + error.message, 'error');
  toast('Snapshot saved'); refreshAll();
}

/* ══════════════════════════ boot ══════════════════════════ */
paintThemeButtonsSafe();
function paintThemeButtonsSafe() { try { paintThemeButtons(); } catch { /* buttons not ready */ } }
const { data: { session } } = await db.auth.getSession();
if (session) enterApp(session.user);
document.body.classList.remove('booting');
db.auth.onAuthStateChange((evt, s) => {
  if (s && (!user || user.id !== s.user.id)) enterApp(s.user);
  else if (!s) leaveApp();
});
