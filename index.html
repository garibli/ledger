  if (canConv) how.push('Your rates: £1 = ' + fmtN(rates.gbpAzn, 4) + ' AZN and $1 = ' + fmtN(rates.usdAzn, 4) + ' AZN' + (rates.at ? ', live rates from ' + new Date(rates.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : ', typed in by you') + '.');
  else how.push('No exchange rates saved, so everything stays in its own currency.');
  if (opt.invest && cache.priceStamp) how.push('Share prices last refreshed ' + new Date(cache.priceStamp).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + '.');
  if (opt.gold && trGold?.usdTry) how.push('$1 = ₺' + fmtN(trGold.usdTry, 2) + ' when the gold prices were fetched.');
  how.push('Made by Ledger on ' + nowTxt + '. This is your own record, not a statement from your broker.');
  setF(9, 'normal', P.ink2);
  how.forEach(line => { const l = doc.splitTextToSize(clean(line), CW); need(l.length * 4.5); doc.text(l, M, y); y += l.length * 4.5 + 1.5; });

  /* page numbers */
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setDrawColor(...P.line); doc.setLineWidth(0.2); doc.line(M, 288, W - M, 288);
    setF(7.5, 'normal', P.muted);
    T('Ledger  ·  ' + parts.join(' and ') + ' report  ·  ' + now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }), M, 292);
    T('Page ' + i + ' of ' + pages, W - M, 292, { align: 'right' });
  }
  doc.setProperties({ title: 'Ledger ' + parts.join(' and ').toLowerCase() + ' report', author: user?.email || 'Ledger', creator: 'Ledger' });
  return doc.output('blob');
}

/* preset: { cat, trip, amount, desc, date, cur, sub } fills the sheet in, for example from a trip page */
function openEntrySheet(preset = {}) {
  const live = activeTrip();
  /* on a trip, a new expense starts as a trip expense */
  if (!preset.cat && live && (ui.day === todayStr() || (ui.day >= live.start_date && ui.day <= live.end_date))) preset = { cat: 'Trip', trip: live.id, ...preset };
  const isTripStart = preset.cat === 'Trip';
  const st = { type: 'expense', cur: isTripStart ? load('ledger.lastTripCur', load('ledger.lastCur', 'GBP')) : load('ledger.lastCur', 'GBP'), cat: null, sub: null, date: ui.day, trip: null, tripPicked: false, ...preset };
  if (preset.trip) st.tripPicked = true;
  if (st.cat === 'Trip' && !preset.date) { const tr = tripById(st.trip); if (tr && !(ui.day >= tr.start_date && ui.day <= tr.end_date) && tripState(tr).k === 'now') st.date = todayStr(); }
  const amount = h('input', { class: 'amount-input', type: 'text', inputmode: 'decimal', placeholder: '0.00', 'aria-label': 'Amount', autocomplete: 'off', enterkeyhint: 'done', value: preset.amount || '' });
  const desc = h('input', { class: 'input', type: 'text', maxlength: 200, placeholder: 'Optional', enterkeyhint: 'done', value: preset.desc || '' });
  const dateLabel = h('span', null, dayTitle(st.date));
  const date = h('input', { type: 'date', value: st.date, 'aria-label': 'Date',
    onchange: e => { if (e.target.value) { st.date = e.target.value; dateLabel.textContent = dayTitle(st.date); if (st.cat === 'Trip' && !st.tripPicked) { st.trip = tripForDate(st.date)?.id || st.trip; paintTrip(); } } } });
  const dateChip = h('label', { class: 'date-chip', onclick: () => { try { date.showPicker?.(); } catch { /* not allowed */ } } },
    h('span', { class: 'emo', 'aria-hidden': 'true' }, '📅'), dateLabel, date);
  const catGrid = h('div', { class: 'cat-grid', role: 'radiogroup', 'aria-label': 'Category' });
  const subWrap = h('div', { class: 'field', hidden: true }, h('span', { class: 'field-label' }, 'What kind?'));
  const subGrid = h('div', { class: 'pill-grid' }); subWrap.appendChild(subGrid);
  const tripWrap = h('div', { class: 'trip-pick', hidden: true });
  const saveBtn = h('button', { class: 'btn btn-primary' }, 'Save expense');
  const label = () => {
    const a = parseAmount(amount.value);
    const kind = st.type === 'expense' ? (st.cat === 'Trip' ? 'trip expense' : 'expense') : 'income';
    saveBtn.textContent = a > 0 ? 'Save ' + money(a, st.cur) + ' ' + kind : 'Save ' + kind;
  };
  amount.addEventListener('input', label);
  amount.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); amount.blur(); } });
  desc.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); } });

  const curBox = h('div', { class: 'cur-box' });
  const paintCur = () => {
    const list = st.cat === 'Trip' ? TRIP_CURS : ['GBP', 'AZN'];
    if (!list.includes(st.cur)) st.cur = list[0];
    clear(curBox); curBox.appendChild(seg(list.map(c => [c, SYM[c]]), st.cur, v => { st.cur = v; label(); }));
    label();
  };
  const pickCat = c => {
    const wasTrip = st.cat === 'Trip';
    st.cat = c; st.sub = null;
    if (c === 'Trip' && !wasTrip) { if (!st.tripPicked) st.trip = tripForDate(st.date)?.id || activeTrip()?.id || nextTrip()?.id || null; st.cur = load('ledger.lastTripCur', st.cur); }
    paintCats(); paintSubs(); paintTrip(); paintCur();
  };
  const paintCats = () => {
    clear(catGrid);
    (st.type === 'expense' ? EXPENSE_CATS : INCOME_CATS).forEach(c => catGrid.appendChild(
      h('button', { type: 'button', class: 'cat' + (st.cat === c ? ' on' : '') + (c === 'Trip' ? ' cat-trip' : ''), role: 'radio', 'aria-checked': st.cat === c, onclick: () => pickCat(c) },
        h('span', { class: 'emo', 'aria-hidden': 'true' }, CAT_EMOJI[c] || '📦'), c)));
  };
  const paintSubs = () => {
    const subs = st.cat === 'Trip' ? null : SUBCATS[st.cat];
    subWrap.hidden = !subs;
    clear(subGrid);
    (subs || []).forEach(sb => subGrid.appendChild(h('button', { type: 'button', class: 'pill' + (st.sub === sb ? ' on' : ''), onclick: () => { st.sub = st.sub === sb ? null : sb; paintSubs(); } },
      h('span', { class: 'emo', 'aria-hidden': 'true' }, SUB_EMOJI[sb] || ''), sb)));
  };
  /* trip: which trip, what for, and which transport */
  const paintTrip = () => {
    tripWrap.hidden = st.cat !== 'Trip';
    clear(tripWrap);
    if (st.cat !== 'Trip') return;
    const today = todayStr();
    const choices = [...cache.trips].filter(t => tripState(t).k !== 'past' || daysBetween(t.end_date, today) <= 60 || t.id === st.trip)
      .sort((a, b) => tripOrder(a) - tripOrder(b) || a.start_date.localeCompare(b.start_date));
    const keep = { amount: amount.value, desc: desc.value, date: st.date, cur: st.cur, sub: st.sub, cat: 'Trip' };
    const newTrip = h('button', { type: 'button', class: 'pill', onclick: () => openTripSheet(null, { after: id => openEntrySheet({ ...keep, trip: id }) }) }, '＋ New trip');
    let pick;
    if (tripStore === 'db') {
      pick = h('div', { class: 'pill-grid' },
        choices.map(t => h('button', { type: 'button', class: 'pill' + (st.trip === t.id ? ' on' : ''), onclick: () => { st.trip = st.trip === t.id ? null : t.id; st.tripPicked = true; paintTrip(); } },
          h('span', { class: 'emo', 'aria-hidden': 'true' }, t.emoji || '🧳'), t.name, h('small', { class: 'pill-note' }, tripStateText(t)))),
        newTrip);
    } else {
      const t = tripForDate(st.date);
      pick = h('div', null, h('div', { class: 'hint' }, t ? 'Counts for ' + (t.emoji || '🧳') + ' ' + t.name + ', by its date.' : cache.trips.length ? 'No trip around this date, so it is kept as trip spending without a trip.' : 'Add a trip to see its total.'),
        h('div', { class: 'pill-grid', style: { marginTop: '8px' } }, newTrip));
    }
    append(tripWrap, [
      h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Which trip?'), pick),
      h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'What for?'),
        h('div', { class: 'pill-grid' }, TRIP_SUBS.map(sb => {
          const on = tripGroup(st.sub) === sb && st.sub !== null;
          return h('button', { type: 'button', class: 'pill' + (on ? ' on' : ''), onclick: () => { st.sub = on ? null : sb; paintTrip(); } },
            h('span', { class: 'emo', 'aria-hidden': 'true' }, CAT_EMOJI[sb] || '📦'), sb);
        }))),
      tripGroup(st.sub) === 'Transport' && st.sub ? h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Which transport?'),
        h('div', { class: 'pill-grid' }, TRIP_TRANSPORT.map(sb => h('button', { type: 'button', class: 'pill' + (st.sub === sb ? ' on' : ''), onclick: () => { st.sub = st.sub === sb ? 'Transport' : sb; paintTrip(); } },
          h('span', { class: 'emo', 'aria-hidden': 'true' }, SUB_EMOJI[sb] || ''), sb)))) : null]);
  };
  const typeSeg = seg([['expense', 'Expense', 'out'], ['income', 'Income', 'in']], st.type, v => {
    st.type = v; st.cat = null; st.sub = null; paintCats(); paintSubs(); paintTrip(); paintCur();
  }, { full: true });
  paintCats(); paintSubs(); paintTrip(); paintCur();

  saveBtn.addEventListener('click', async () => {
    const a = parseAmount(amount.value);
    if (!(a > 0)) return shake(amount);
    if (!st.cat) { catGrid.animate?.([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], 300); return toast('Pick a category', 'error'); }
    const isTrip = st.cat === 'Trip';
    const d = desc.value.trim() || st.sub || st.cat;
    const row = { date: st.date, type: st.type, amount: a, currency: st.cur, description: d, category: st.cat, subcategory: st.sub, user_id: user.id };
    if (isTrip && tripStore === 'db' && st.trip) row.trip_id = st.trip;
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    let { error } = await db.from('entries').insert([row]);
    if (error && row.trip_id && /trip_id/.test(error.message || '')) {
      /* the trips table is there but the expenses column is not: save it anyway, linked by date */
      delete row.trip_id; ({ error } = await db.from('entries').insert([row]));
      if (!error) toast('Saved. Run the trips SQL again to link expenses to a trip yourself', 'error');
    }
    saveBtn.disabled = false; label();
    if (error) return toast('Could not save: ' + error.message, 'error');
    save(isTrip ? 'ledger.lastTripCur' : 'ledger.lastCur', st.cur);
    ui.day = st.date; ui.month = ui.day.slice(0, 7);
    ui.flashKey = ui.day + '|' + d + '|' + a;
    closeSheet();
    const tr = isTrip ? (row.trip_id ? tripById(row.trip_id) : tripForDate(st.date)) : null;
    toast(st.type === 'income' ? 'Income saved' : tr ? 'Saved to ' + tr.name : 'Expense saved');
    if (st.cur === 'TRY' && !tryPerUsd() && ratesReady()) fetchLiveRates();   // so lira can be converted
    refreshAll();
  });

  openSheet('Add to your ledger', h('div', null,
    h('div', { class: 'field' }, typeSeg),
    h('div', { class: 'amount-wrap' }, amount, curBox),
    h('div', { class: 'field' }, h('span', { class: 'field-label' }, 'Category'), catGrid),
    subWrap, tripWrap,
    field('Note', desc)),
    { onOpen: () => amount.focus(), footer: h('div', { class: 'foot-row' }, dateChip, saveBtn) });
}

  };
  const preview = h('div', { class: 'hint box', hidden: true });
  const upd = () => {
    const m = tradeMath({ side, quantity: parseAmount(f.qty.value), price_per_share: parseAmount(f.price.value), commission: parseAmount(f.comm.value), fx_rate: parseAmount(f.fx.value) });
    if (!m.cost) { preview.hidden = true; return; }

  };
  ['qty', 'price', 'comm', 'fx'].forEach(k => f[k].addEventListener('input', upd));

    const ticker = f.ticker.value.trim().toUpperCase(), q = parseAmount(f.qty.value), p = parseAmount(f.price.value);

      trade_date: f.date.value || t, trade_time: f.time.value || null, ticker, side, quantity: q, price_per_share: p,

    }]);
    btn.disabled = false; btn.textContent = 'Save trade';
    if (error) return toast('Could not save: ' + error.message, 'error');
    closeSheet(); toast('Trade saved'); refreshAll();
  });
  openSheet('Add a trade', h('div', null,
    h('div', { class: 'field' }, seg([['Buy', 'Buy', 'in'], ['Sell', 'Sell', 'out']], side, v => { side = v; upd(); }, { full: true })),
    h('div', { class: 'field-row' }, field('Fund', f.ticker), field('Quantity', f.qty)),
    h('div', { class: 'field-row' }, field('Price per share, $', f.price), field('Fee, $', f.comm)),
    h('div', { class: 'field-row' }, field('Date', f.date), field('Time', f.time)),
    h('div', { class: 'field-row' }, field('Manat per $1', f.fx), field('Platform', f.plat)),
    field('Note', f.note), preview), { onOpen: () => f.ticker.focus(), footer: btn });
}

    liveBtn,
    h('div', { class: 'hint box' }, (rates.at
      ? 'Live market rates from ' + new Date(rates.at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + (tryPerUsd() ? ', and $1 = ₺' + fmtRate(tryPerUsd()) : '') + '. '
      : '') + 'They update by themselves every time you tap ↻ Refresh prices or ↻ Fetch live. You can still type your own and save. Every page uses them, on your phone and your laptop alike.'),
    syncNote()),
    { onOpen: () => g.focus(), footer: btn });
}

function openAccountSheet() {
  openSheet('Your account', h('div', null,
    h('div', { class: 'hint box', style: { marginBottom: '16px' } }, 'Signed in as ' + (user?.email || '')),
    h('div', { class: 'field' }, h('button', { class: 'btn btn-ghost block', onclick: e => { toggleTheme(); e.currentTarget.textContent = currentTheme() === 'dark' ? '☀️ Switch to light' : '🌙 Switch to dark'; } }, currentTheme() === 'dark' ? '☀️ Switch to light' : '🌙 Switch to dark')),
    h('button', { class: 'btn btn-ghost block', style: { color: 'var(--red)' }, onclick: () => { closeSheet(); db.auth.signOut(); } }, 'Sign out')));
}

/* ══════════════════════════ ACTIONS ══════════════════════════ */
async function removeRow(table, id, label) {
  if (!confirm('Delete ' + label + '? This cannot be undone.')) return;
  const { error } = await db.from(table).delete().eq('id', id);
  if (error) return toast('Could not delete: ' + error.message, 'error');
  toast('Deleted'); refreshAll();
}
async function savePrice(ticker, price) {
  if (!user || !(price > 0)) return;
  const { error } = await db.from('prices').upsert({ user_id: user.id, ticker, price, updated_at: new Date().toISOString() }, { onConflict: 'user_id,ticker' });
  if (error) return toast('Could not save the price', 'error');
  cache.prices[ticker] = price; cache.priceStamp = new Date().toISOString();
  toast(ticker + ' price saved');
  renderInvest(); renderNetWorth(); renderAnalysis();
}
async function refreshPrices(ev) {
  if (!user) return;
  const btn = ev?.currentTarget;
  const tickers = [...new Set(buildHoldings().open.map(x => x.ticker))];
  if (!tickers.length) return toast('No open positions to price', 'error');
  if (btn) { btn.disabled = true; btn.textContent = 'Fetching…'; }
  try {
    const { data, error } = await db.functions.invoke('quotes', { body: { tickers: [...tickers, ...FX_TICKERS] } });
    if (error) throw error;
    applyLiveRates(data?.prices);
    const got = Object.fromEntries(Object.entries(data?.prices || {}).filter(([t]) => tickers.includes(t)));
    const names = Object.keys(got);
    if (!names.length) throw new Error('nothing came back');
    const now = new Date().toISOString();
    const { error: e2 } = await db.from('prices').upsert(names.map(t => ({ user_id: user.id, ticker: t, price: Number(got[t]), updated_at: now })), { onConflict: 'user_id,ticker' });
    if (e2) throw e2;
    names.forEach(t => { cache.prices[t] = Number(got[t]); });
    cache.priceStamp = now;
    const failed = (data.failed || []).filter(t => tickers.includes(t));
    toast('Updated ' + names.length + (names.length === 1 ? ' price' : ' prices') + (failed.length ? '. ' + failed.join(', ') + ' failed' : ''));
    renderAll();
  } catch (err) {
    toast('Could not fetch prices (' + (err.message || err) + '). Type them in by hand.', 'error');
    if (btn) { btn.disabled = false; btn.textContent = '↻ Refresh prices'; }
  }
}
/* live exchange rates from the market (the same numbers Google shows):
   $ to ₼, £ to ₼ (worked out as £ to $ times $ to ₼), and $ to ₺ */
const FX_TICKERS = ['AZN=X', 'GBPUSD=X', 'TRY=X'];
function applyLiveRates(prices) {
  const usdAzn = num(prices?.['AZN=X']), gbpUsd = num(prices?.['GBPUSD=X']), usdTry = num(prices?.['TRY=X']);
  let done = false;
  if (usdAzn > 0 && gbpUsd > 0) {
    rates = { gbpAzn: Number((gbpUsd * usdAzn).toFixed(4)), usdAzn: Number(usdAzn.toFixed(4)), base: base(), at: new Date().toISOString() };
    save('ledger.rates', rates); done = true;
  }
  if (usdTry > 0) { trGold = { ...(trGold || { items: {} }), usdTry: Number(usdTry.toFixed(4)) }; save('ledger.trGold', trGold); done = true; }
  if (done) pushSettings(false);
  return done;
}
async function fetchLiveRates(btn) {
  if (!user) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Fetching…'; }
  try {
    const { data, error } = await db.functions.invoke('quotes', { body: { tickers: FX_TICKERS } });
    if (error) throw error;
    if (!applyLiveRates(data?.prices)) throw new Error('no rates came back');
    closeSheet();
    toast('Live rates: £1 = ₼' + fmtRate(rates.gbpAzn) + ', $1 = ₼' + fmtRate(rates.usdAzn) + (tryPerUsd() ? ', $1 = ₺' + fmtRate(tryPerUsd()) : ''));
    renderAll();
  } catch (err) {
    toast('Could not fetch rates (' + (err.message || err) + '). Type them in instead.', 'error');
    if (btn) { btn.disabled = false; btn.textContent = '↻ Live rates'; }
  }
}
async function fetchGoldPrice(want, btn) {
  if (!user) return;
  btn.disabled = true; btn.textContent = 'Fetching…';
  try {
    const { data, error } = await db.functions.invoke('quotes', { body: { tickers: ['GC=F', ...FX_TICKERS], tr_gold: true } });
    if (error) throw error;
    const oz = data?.prices?.['GC=F'], aznPerUsd = data?.prices?.['AZN=X'], usdTry = data?.prices?.['TRY=X'];
    const now = new Date().toISOString();

    // Turkish market
    let trNote = '';
    applyLiveRates(data?.prices);
    if (data?.tr_gold?.items?.gram) {
      trGold = { items: data.tr_gold.items, usdTry: usdTry || tryPerUsd(), at: now };
      save('ledger.trGold', trGold);
    } else if (data && !('tr_gold' in data)) {
      trNote = ' Turkish prices need the new quotes function (v3) in Supabase.';
    } else {
      trNote = ' Turkish prices could not be loaded' + (data?.tr_gold_error ? ' (' + data.tr_gold_error + ')' : '') + '.';
    }

    // world price per gram in dollars; if Yahoo fails, work it out from the Turkish gram price
    let usdG = oz ? oz / GRAMS_PER_TROY_OZ : null;
    if (!usdG && trGold?.items?.gram && tryPerUsd()) usdG = (trGold.items.gram.buy + trGold.items.gram.sell) / 2 / tryPerUsd();
    if (!usdG) throw new Error('no gold price came back');

    let value, cur, how;
    if (want === 'TRY' && trGold?.items?.gram && trGold.at === now) {
      value = (trGold.items.gram.buy + trGold.items.gram.sell) / 2; cur = 'TRY'; how = 'the Turkish gram price (Bigpara)';
    } else if (want === 'TRY' && tryPerUsd()) {
      value = usdG * tryPerUsd(); cur = 'TRY'; how = money(usdG, 'USD') + ' a gram at ₺' + tryPerUsd().toFixed(2) + ' to the dollar';
    } else if (want === 'AZN' && aznPerUsd) {
      value = usdG * aznPerUsd; cur = 'AZN'; how = money(usdG, 'USD') + ' a gram at ' + num(aznPerUsd).toFixed(4) + ' manat to the dollar';
    } else if (want === 'GBP' && ratesReady()) {
      value = usdG * rates.usdAzn / rates.gbpAzn; cur = 'GBP'; how = money(usdG, 'USD') + ' a gram at your saved rates';
    } else {
      value = usdG; cur = 'USD'; how = money(usdG, 'USD') + ' a gram';
    }
    goldSpot = { price: Number(value.toFixed(2)), cur }; save('ledger.goldSpot', goldSpot); pushSettings();
    ui.goldStamp = (oz ? 'Gold is ' + money(oz, 'USD') + ' an ounce. ' : '') + 'Price set from ' + how + '. Fetched ' +
      new Date(now).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '.' + trNote;
    toast(trNote ? 'Gold prices updated.' + trNote : 'Gold prices and live rates updated', trNote ? 'error' : 'ok');
    renderGold(); renderNetWorth(); renderAnalysis();
  } catch (err) {
    toast('Could not fetch gold (' + (err.message || err) + '). Type it in instead.', 'error');
    btn.disabled = false; btn.textContent = '↻ Fetch live';
  }
}
async function saveBalance(id, balance) {
  const now = new Date().toISOString();
  const { error } = await db.from('accounts').update({ balance, updated_at: now }).eq('id', id);
  if (error) return toast('Could not save the balance', 'error');
  const a = cache.accounts.find(x => x.id === id);
  if (a) { a.balance = balance; a.updated_at = now; }
  toast('Balance updated');
  renderNetWorth();
}
async function saveSnapshot(date, note, btn) {
  if (!user || !ratesReady()) return toast('Set the exchange rates first', 'error');
  const b = base(), p = netWorthParts(b);
  btn.disabled = true;
  const { error } = await db.from('networth_snapshots').upsert({
    user_id: user.id, snap_date: date || todayStr(), base_currency: b,
    investments: Number(p.investments.toFixed(2)), gold: Number(p.gold.toFixed(2)), cash: Number(p.cash.toFixed(2)), total: Number(p.total.toFixed(2)),
    gbp_azn: rates.gbpAzn, usd_azn: rates.usdAzn, note: (note || '').trim() || null,
  }, { onConflict: 'user_id,snap_date' });
  btn.disabled = false;
  if (error) return toast('Could not save: ' + error.message, 'error');
  toast('Snapshot saved'); refreshAll();
}

db.auth.onAuthStateChange((evt, s) => {

  else if (!s) leaveApp();
});
